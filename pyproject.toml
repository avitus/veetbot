[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "modular-general-purpose-ai-agent"
version = "0.1.0.dev0"
description = "A modular, provider-neutral general-purpose AI agent platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "alembic>=1.14,<2",
  "anthropic>=0.74,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "openai>=2.0,<3",
  "pydantic>=2.10.6,<3",
  "pyyaml>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "typer>=0.15,<1",
  "tzdata>=2025.2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
agent = "agent_core.cli.main:app"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
]
test = [
  "hypothesis>=6.124,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "types-pyyaml>=6.0.12,<7",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "pymdown-extensions>=10.7,<11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["archive", "docs", "site", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["agent_core"]

[tool.mypy]
python_version = "3.12"
strict = true
no_implicit_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "static: tests that need no runtime, database, or network",
  "integration: tests that require PostgreSQL or another local service",
  "live: tests that call a real model provider and may incur cost",
]
