# Evidence for completed milestones 0 through 9 lives in
# docs/status/verification-history.yaml; an in-progress milestone's
# evidence stays here until it completes.
verification:
  history: docs/status/verification-history.yaml
  milestone_10:
    recorded_at: 2026-08-19T21:21:18Z
    status: in_progress
    evidence:
      - check: test-driven memory maturation gates
        outcome: passed_locally
        detail: >-
          The initial red run failed all six ordinary-conversation and lifecycle
          tests, the correction/topic expansion failed its two new cases, and an
          adversarial extractor failed both service-boundary cases. Review-driven
          red tests then exposed negated possessive duplication, generic
          preference collisions, pending-session starvation, inaccurate action
          counters, and the missing consolidation claim. A second hosted review
          drove four more red regressions for non-positive batch limits,
          independent clause and text-part boundaries, truthful overflow audits,
          and inferred-confidence authority. A third hosted review drove two
          further red cases for canonical preference reinforcement and complete
          audit reconciliation. The latest full review added red regressions for
          temporal-hint preservation, coordinated possessive retractions, the
          persisted formation deadline, and the formation-scan index. After the
          corresponding implementation steps, the next full review exposed a
          duplicate possessive proposal; its red audit-reconciliation regression
          now passes. A later PostgreSQL red regression proved that one malformed
          deadline could poison a sweep; malformed and timezone-naive deadlines
          are now rejected consistently. All 28 Milestone 10 memory gate tests
          pass.
      - check: routed rich memory extraction reference contract
        outcome: passed_locally
        detail: >-
          Five focused model-extraction tests prove that a strict-schema routed
          policy forms a relationship the deterministic grammar misses, records
          normalized usage in a content-free process event, rejects an
          unsupported named entity, falls back on malformed output, and rejects
          output beyond its dedicated budget. The existing memory formation,
          source-integrity, injection, candidate-cap, and no-policy-regression
          gates remain unchanged. Accepted ADR-0057 now owns the stricter
          composition boundary: the reference extractor remains covered directly,
          while normal composition requires exact activation evidence and the
          balanced OpenAI/default tuple has passing release-bundled evidence.
      - check: Milestone 10A skill-authoring gates
        outcome: passed_locally
        detail: >-
          All six registered gates passed through eleven focused tests covering
          trust and exact scope denials, canonical bounded approvals, default-off
          construction, confined child reviews, non-fatal review failure,
          durable provenance and replay, optimistic conflicts, and the
          self-authored case 27 outcome change.
      - check: governed memory inspection surface
        outcome: passed_locally
        detail: >-
          Red tests first failed because consolidation audits, belief get, and
          trace inspection were unreachable. The implemented agent memory CLI
          now lists and gets full belief records, filters by source session,
          edits and deletes through the governed service, lists formation audits,
          and reads principal-scoped retrieval traces. All 55 focused unit and
          contract tests passed, and the PostgreSQL idle-formation integration
          proves session-filtered beliefs and audit counts survive the durable
          adapter.
      - check: evaluation-gated provider-assisted memory extraction
        outcome: passed_locally
        detail: >-
          Red tests first showed that activation accepted no evidence boundary,
          provider extraction had no implementation, composition could not select
          it, and an evidence-gathering build mode did not exist. The restricted
          maintenance extractor now makes one tool-free schema-constrained call,
          records content-free identity, policy, budget, deadline, usage, cost,
          source, and outcome audit data, falls back deterministically, and sends
          every proposal through the existing source and safety gates. Automatic
          startup selection activates matching operator or release-bundled
          evidence and otherwise retains deterministic formation; off and
          required modes preserve explicit no-resolution and fail-closed choices.
          The 24-case paired CLI evaluator derives the corpus and model tuple and
          creates no artifact unless lift, fabrication, and policy gates pass.
          Focused provider, evaluator, CLI, configuration, and
          review-remediation tests pass, including distinct candidate polarity,
          belief types, statements, and sources; dotted-number grounding; export
          consent handling; JSON export; and memory-list boundary validation.
      - check: formal memory gate and extractor contract reconciliation
        outcome: passed_locally
        detail: >-
          Red accounting tests first failed because the governed inspection and
          provider-assisted guarantees had no registry identities and only the
          deterministic extractor was named by the shared port contract. Six new
          Milestone 10 gates now cover principal-scoped inspection and mutation,
          all shipped extractor implementations, exact activation evidence,
          provider safety authority, audited deterministic fallback, and evidence
          publication. The extractor contract runs deterministic, model-assisted,
          and provider-assisted implementations against the same separate,
          scope-correct, provenance-bound proposal assertions, with both assisted
          paths forced through deterministic fallback. The registry reconciles at
          200 entries, including 34 at Milestone 10.
      - check: make check
        outcome: passed
        detail: >-
          Ruff formatting and linting, strict mypy over 439 source and test
          files, 717 static tests, 296 contracts, deployment-script checks,
          121 citation checks, and strict documentation builds pass on the
          integrated head. The static count includes the 25-case evaluation
          front end relocated from the DB-gated integration directory. The
          gate registry contains 200 entries and retains 166 as the verified
          ceiling through Milestone 9.
      - check: PostgreSQL integration and resilience partition
        outcome: passed
        detail: >-
          An isolated Compose PostgreSQL 16 database upgraded from empty through
          revision d2a6f8b1c304 and all 96 integration and resilience tests
          passed, including memory formation, durable skill-authoring approval
          and provenance, capability persistence, persisted web invocations and
          web-enabled recomposition, browser profile, authentication, and
          standing-grant persistence, transcript restoration, migrations, and
          re-composition.
      - check: default-off rollout boundary
        outcome: passed_locally
        detail: >-
          Foreground authoring and background review both default off;
          configuration refuses background review without foreground authoring,
          and skill.manage is absent from the registry until explicitly enabled.
      - check: provider-neutral web access contract
        outcome: passed_locally
        detail: >-
          The focused 112-test web partition covers shared Tavily and Firecrawl
          search/fetch contracts, domain and URL validation, capability-level
          composition, stable auth and retry failures, public-HTTPS fetch
          validation, fixed-target policy, default-off registration, bounded
          search output, the untrusted envelope reaching the next model step,
          same-turn trust escalation blocking memory writes, and persisted
          external-untrusted invocations with web-enabled recomposition on
          PostgreSQL. Seven formal gate.web entries cover that contract;
          `agent eval gates
          --milestone 10 --area web` reports seven passed, zero failed, and zero
          pending.
      - check: authenticated browser automation and formal gates
        outcome: passed_locally
        detail: >-
          `agent eval gates --milestone 10 --area browser` reports all ten
          provider, default-off, origin-isolation, observation-trust,
          revision-binding, action-authority, uncertain-write, profile-lifecycle,
          authentication, and standing-grant gates passed with zero failures or
          pending placeholders. The provider-neutral tools support bounded
          navigation, observation, and approval-governed actions through both
          ephemeral Playwright and hosted stateful providers. Stable handles,
          exact page revisions, trusted profile-origin binding, conservative
          consequence classification, effect watermarking, uncertain-outcome
          persistence, DNS-pinned egress, and external-untrusted observations
          preserve the documented authority and trust boundaries.

          The hosted control plane now provides generation-fenced profile
          lifecycle, leased sessions, a five-minute user-direct login ceremony,
          bounded interactive events and screenshots, durable authentication
          records, and exact routine-action standing grants. Public profile,
          authentication, and grant routes enforce their dedicated scopes; the
          execution pipeline re-runs deterministic policy before honoring a
          matching grant and records the authorization kind and reference.
          Profile material remains outside PostgreSQL in versioned AES-256-GCM
          envelopes whose authenticated metadata binds tenant, principal,
          profile generation, origin scope, format, revocation, and key version.
          The three browser tables use forced tenant RLS and migrations pass
          from an empty database through revision d2a6f8b1c304.

          The isolated service authenticates before bounded request buffering,
          accepts only private-file credentials and key material, returns bounded
          generic failures, and is the only additional approved process
          composition root for its secret-bearing package. Its production image
          installs Chromium and runs as uid 65532 with dropped capabilities,
          no-new-privileges, a read-only root, private secret mounts, resource
          limits, a separate outbound network, and only a loopback host binding
          behind the configured HTTPS reverse proxy. The production Compose
          overlay validates, the image builds, and an in-container Playwright
          smoke test launched Chromium 151.0.7922.34 as the unprivileged runtime
          user. A second smoke test ran the real service entry point as uid
          65532 with a read-only root, all capabilities dropped, and
          pre-provisioned private secret and material volumes; its authenticated
          control-plane flow provisioned a profile, acquired a lease, launched
          Chromium, navigated through the audited proxy to `https://example.org`,
          sealed the session, revoked the profile, and deleted its encrypted
          material. Release preflight validates the service-auth, session-secret,
          key, and HTTPS ceremony inputs and waits for service health.
      - check: Apple client and signing regression suite
        outcome: passed
        detail: >-
          All 82 Swift Testing cases passed, including complete historical
          transcript restoration, sidebar conversation navigation,
          forward-compatible message-role decoding, system composer sizing,
          connection-settings layout, and the missing-keychain-entitlement
          regression.
      - check: real-Docker sandbox security partition
        outcome: passed
        detail: All 10 sandbox security tests passed against a freshly built image.
      - check: accepted ADR-0051
        outcome: approved_and_implemented
        detail: >-
          The durable post-run flag, 30-second idle boundary, structured
          extractor port, source and scope rechecks, semantic conflict subjects,
          independently audited extractor and service caps, inferred-confidence
          ceiling, temporal-hint preservation, transactional replacement,
          formation-scan index, hybrid extractor reference implementation,
          content-free model-usage audit, deterministic fallback, and formation@3
          policy boundary are approved and implemented. ADR-0051 remains accepted
          architecture for the automatic-memory lifecycle, while accepted ADR-0057
          supersedes its unconditional routed-policy activation and provider budget
          with the stricter version-bound evidence gate.
      - check: proposed ADR-0052
        outcome: owner_review_requested
        detail: >-
          The independently authorized tranche, invocation idempotency, durable
          provenance across session erasure, dedicated child-session placement,
          disabled-candidate activation, no-review-archive rule, and quantitative
          rollout threshold are recorded for owner review.
      - check: proposed ADR-0054
        outcome: owner_review_requested
        detail: >-
          The provider-neutral web port, capability-level provider selection,
          fixed HTTPS endpoints, external-untrusted labeling, and default-off
          registration are recorded for owner review.
      - check: accepted ADR-0055
        outcome: approved_and_implemented
        detail: >-
          The configurable CLI run wait with its positive-value boundary and
          300-second default is approved and implemented.
      - check: intended-production-model memory evaluation
        outcome: failed_gate
        detail: >-
          The checked-in 24-case corpus ran against the balanced policy resolved
          to OpenAI gpt-5.6-sol. Both arms supported zero labeled candidates. The
          provider arm committed two unsupported beliefs, including one protected
          secret case, and therefore published no activation artifact. Diagnosis
          identified an under-specified free-form candidate schema, statement-only
          safety checks that lost source hazards after paraphrasing, asymmetric
          evaluator diagnostics, and an aggregate lift threshold without a
          positive-case coverage floor.
      - check: formation@4 evaluation-pipeline regression suite
        outcome: passed
        detail: >-
          Regression coverage now proves canonical local rendering from closed
          semantic provider claims, exact evidence-quote grounding, authoritative
          source hazard rechecks, symmetric arm scoring and fabrication reporting,
          inspectable failed-run diagnostics, non-zero failed CLI status, and a
          sixteen-of-twenty positive-case publication floor. The final repository
          check passed formatting, lint, type checking, 853 static tests, 324
          contract tests, deployment-script tests, and strict documentation and
          227-entry gate-registry reconciliation. After Docker became available,
          all 10 real-container sandbox security tests passed and the unrestricted
          repository suite completed with 1,182 passed and 94 explicitly skipped.
      - check: formation@4 intended-production-model activation evaluation
        outcome: passed
        detail: >-
          The version-bound 24-case evaluation at immutable build
          7de9a98f550e60130f7f7131d78ca537e720685b resolved the balanced policy to
          OpenAI gpt-5.6-sol and the default compiled policy to
          default@8905b6f85895+hb03f69cf. The provider arm completely supported
          18 of 20 positive cases and 19 candidates versus 9 deterministic
          candidates, with zero fabrication and zero policy failures in both
          arms. The protected question, transient, secret, and injection cases
          remained empty. Schema-v2 evidence for corpus hash
          b10ae25558d3236b9a0a47cad59d4b89ff6824085cba79656cc90740bc7d8c43 is
          bundled under the provider-memory release-evidence trust boundary.
      - check: accepted ADR-0057
        outcome: approved_and_implemented
        detail: >-
          The dedicated maintenance placement, exact evidence binding, fixed
          provider budget, user-episode selection, deterministic safety authority,
          content-free call audit, non-production evaluation mode, fallback, and
          formation@4 semantic-claim, source-safety, diagnostic, and positive-case
          coverage boundaries are accepted, implemented, and backed by passing
          intended-production-model evidence.
    remaining:
      - Run every hosted CI lane and complete the GitHub CodeRabbit review on
        the same final head, resolving every finding and conversation.
    activation_pending:
      # Tenant activation is not a completion condition (ADR-0061); it is
      # roadmap item B1 and stays default-off until the evidence rule passes.
      - Record at least 30 paired rollout samples for each model-policy,
        policy-profile, and authoring-version combination; require at least five
        absolute percentage points of completion lift, a positive 95 percent
        Clopper-Pearson lower bound, and zero additional policy failures before
        enabling skill authoring for a tenant.
  milestone_11:
    recorded_at: 2026-08-19T20:49:16Z
    status: in_progress
    evidence:
      - check: focused gate-registry red-green cycle
        outcome: passed
        detail: >-
          The valid red run failed three assertions because the registry parser
          rejected Milestone 11 and schedule gate identifiers and the census
          still expected 177 gates through Milestone 10. The implementation
          step admitted the schedule area and Milestone 11, initially
          registered fifteen functional gates, and updated the census; all nine
          focused tests passed.
      - check: make check
        outcome: passed
        detail: >-
          Ruff formatting and linting, strict mypy over 375 source and test
          files, 504 static tests, 191 contracts, deployment-script checks,
          123 citation checks, and strict documentation builds pass. The gate
          registry initially contained 192 entries and retained 166 as the
          verified ceiling through Milestone 9. This evidence predates the
          persistence-discipline gate expansion.
      - check: proposed ADR-0059
        outcome: owner_review_requested
        detail: >-
          The ordinary-run execution model, immutable revisions, civil-time and
          daylight-saving rules, bounded misfires, fresh authority, occurrence
          idempotency, non-overlap, quotas, and default-off rollout boundary are
          recorded for owner review.
      - check: recurrence and civil-time red-green cycle
        outcome: passed_locally
        detail: >-
          After an import-only scaffold made the behavioral test collect, the
          valid red run failed all seven cadence and recurrence tests. The
          implementation now validates one-time, daily, and weekly definitions,
          normalizes aware instants and weekdays, computes next and latest-due
          occurrences without backlog iteration, preserves civil time across
          offset changes, advances spring gaps, and chooses the earlier fall-fold
          instant. Seven focused tests, including generated cases across five
          time zones, pass; gate.schedule.civil_time now names the real property
          check. The later gate expansion does not alter that evidence.
      - check: scheduling persistence discipline red-green cycle
        outcome: passed
        detail: >-
          A valid registry red failed at 192 rather than 200 entries, and the
          existing contract-coverage gate reported missing named contracts for
          the occurrence and idempotency ports. The registry now contains 200
          entries, including eight explicit domain, contract, schema,
          migration, transaction, erasure, and isolation gates. All three
          scheduling ports have shared in-memory and PostgreSQL adapter
          contracts. Domain, schema, repository, gate-registry, static, and
          contract lanes pass. A repository-managed PostgreSQL 16 service then
          passed all six focused migration and scheduling-persistence tests and
          all 109 integration and resilience tests, including unit-of-work
          rollback, erasure, isolation, and migration behavior.
      - check: schedule materialization red-green cycle
        outcome: passed_locally
        detail: >-
          The valid behavioral red run failed three tests at the unimplemented
          principal-directory and materializer seams. Shared principal-directory,
          due-lock, advance, and occurrence-lookup contracts now pass. The
          materializer revalidates current scopes and enabled state, stamps only
          requested scopes and finite revision limits on a priority-10 ordinary
          run, creates its session, event sequence, seed checkpoint, process
          event, occurrence, and schedule advance in one transaction, and uses
          deferred occurrence-link foreign keys so the natural-key occurrence is
          written first. PostgreSQL gates prove two concurrent schedulers commit
          exactly one result and injected crashes after each of nine write
          boundaries leave no partial state; retry returns the one complete
          occurrence. The three registry entries materialize_once,
          materialize_atomic, and authority_fresh now point to those executable
          checks. The final local verification passes Ruff, mypy over 385 files,
          516 static tests, 197 contract tests, deployment checks, strict docs
          and citation validation, and all 111 PostgreSQL integration and
          resilience tests, including both materialization gates.
      - check: schedule overlap and admission red-green cycles
        outcome: passed_locally
        detail: >-
          The valid overlap red materialized a second run while the preceding
          occurrence remained queued. The implementation adds a contracted
          latest-materialized occurrence query for both memory and PostgreSQL,
          records one SKIPPED_OVERLAP decision without incrementing failures,
          leaves the linked run unchanged, and allows another schedule to
          progress. The admission red separately failed at the unimplemented
          development controller and because the materializer ignored retry;
          the closed controller contract now distinguishes ALLOW, transient
          RETRY with no write, and terminal REJECT recorded as MISSED. Seventeen
          focused registry, contract, and static tests and all seven focused
          PostgreSQL schedule persistence and materialization tests pass. The
          final repository verification passes Ruff, mypy over 387 files, 518
          static tests, 198 contract tests, deployment and strict documentation
          checks, and all 112 PostgreSQL integration and resilience tests.
      - check: PostgreSQL schedule admission red-green cycle
        outcome: passed_locally
        detail: >-
          The valid PostgreSQL red failed at the unimplemented production
          controller. The controller now shares the materialization transaction,
          takes a tenant-derived advisory transaction lock, and decides against
          committed active scheduled runs, one-minute materializations, active
          maximum-cost reservations, and daily and monthly scheduled usage. Four
          positive versioned ceilings extend the executable configuration
          inventory from 106 to 110. Empty-tenant, decision-matrix, and concurrent
          last-slot tests pass; the race admits exactly one run and leaves the
          other schedule due without an occurrence. Final verification passes
          Ruff, mypy over 388 files, 518 static tests, 198 contract tests,
          deployment and strict documentation checks, and all 115 PostgreSQL
          integration and resilience tests.
      - check: bounded schedule worker red-green cycle
        outcome: passed_locally
        detail: >-
          The valid worker red failed at the unimplemented run_once method. The
          worker now scans one deterministic bounded due batch, materializes
          each definition in its own transaction, isolates definition and scan
          failures while propagating cancellation, and waits for the earlier of
          the next durable fire time and a bounded fallback poll. Already-due
          work uses an admission backoff. Shared repository contracts cover the
          next-fire query, the worker-service contract includes the new role,
          and a PostgreSQL integration proof leaves the third of three due
          definitions untouched when the batch is two. Three positive
          versioned limits extend the executable inventory from 110 to 113.
          Composition exposes the worker for development but fails closed for
          non-development identity until a durable principal directory exists;
          production deployment remains default-off. Final verification passes
          Ruff, mypy over 391 files, 520 static tests, 198 contract tests,
          deployment and strict documentation checks, and all 126 PostgreSQL
          integration and resilience tests.
      - check: schedule lifecycle and public-boundary red-green cycles
        outcome: passed_locally
        detail: >-
          Valid reds first exposed absent lifecycle operations, absent
          default-off flags and routes, incomplete definition ceilings, and
          missing terminal accounting. Create, list, point read, update, pause,
          resume, cancel, and occurrence history now enforce exact scopes,
          optimistic revisions, immutable definitions, request idempotency,
          stable bounded cursors, principal isolation, and secret-shaped input
          rejection. Materialized run completion is linked back to its owner,
          accounted exactly once, and resets or increments the consecutive
          failure counter before applying the automatic-pause threshold. The
          offline boundary recovers completed, failed, cancelled, missed, and
          overlap-skipped outcomes through exact durable run links.
      - check: isolated production topology, wakeup, fairness, and metrics red-green cycles
        outcome: passed_locally
        detail: >-
          Valid reds exposed the missing lean production builder, async worker
          factory, schedule systemd unit, cross-process wakeup, and telemetry
          vocabulary. The sole bootstrap root now builds a least-privilege
          PostgreSQL schedule role with configured content-versioned authority
          and no execution or API credential. Fixed-channel LISTEN/NOTIFY
          interrupts a bounded durable poll without becoming a correctness
          dependency. Interactive and async workers claim disjoint priority
          classes; production release tests exercise both default-off and
          enabled scheduler activation. Content-free OpenTelemetry instruments
          cover scans, lag, dispositions, misfires, admission, cost, outcomes,
          auto-pause, cancellation, lease reclaim, and class-specific claim
          latency. Six definition ceilings and two reserved-capacity limits
          extend the executable configuration inventory from 113 to 121.
      - check: complete Milestone 11 executable gate contract
        outcome: passed_locally
        detail: >-
          Every one of the twenty-three gate.schedule registry entries names a
          real test, property, corpus, contract, migration, or structural check;
          none uses a provisional target. The canonical gate runner reports
          23 passed, zero failed, and zero pending for Milestone 11. Integration
          with the current origin/dev head produced valid cumulative reds for
          documentation allowlist drift and a class-only provider-evidence
          selector that pytest could not collect. Exact allowlist locations, an
          executable test-method selector, and nested-selector registry
          validation corrected those failures. The final canonical run reports
          all 223 cumulative gates passed with zero failed or pending.
      - check: complete local static, contract, deployment, migration, integration, and resilience lanes
        outcome: passed_locally
        detail: >-
          On the final rebased origin/dev head, Ruff formatting and linting,
          strict mypy over 469 source and test files, 760 static tests, 305 adapter
          contracts, both production deployment script suites, strict
          documentation and 121 citation checks, and 102 PostgreSQL integration
          and resilience tests pass. Migration coverage upgrades an empty
