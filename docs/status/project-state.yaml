project:
  name: modular-general-purpose-ai-agent
  phase: implementation
  status: milestone_14_complete
  canonical_plan: docs/plan/engineering-plan.md
  # Milestone 14 completed on 2026-10-07 when pull request 153 carried the last
  # repair from the owner's production Telegram smoke (2026-10-06) through
  # hosted CI and a clean CodeRabbit review on its final head; the completion
  # and the ceiling's advance to Milestone 14 (289 gates) were recorded on
  # 2026-10-09. Milestone 13 completed on 2026-08-27 (recorded 2026-09-28).
  current_milestone: 14
  active_milestone: 15
  # ADR-0172 records the owner-approved same-chat website continuation repair,
  # interactive authority for owner replies, and specific single-action X follow
  # consent. No milestone or gate moves; production acceptance awaits delivery.
  # ADR-0168 records the owner's 2026-10-09 browser approval repair: the
  # default policy permits a bounded scroll in an owner-originated task,
  # including schedules, while other actions retain their approval rules.
  # No milestone or gate moves; production acceptance follows delivery.
  # ADR-0165 records the owner's 2026-10-08 extension of Milestone 31: a
  # suspected-spam flag from the importance assessment, informed by Gmail's
  # own DMARC result, that never touches Gmail, plus thread-level Report spam
  # and Not spam through Archive's gesture. Three gates join the milestone.
  # ADR-0164 records the owner's instruction to implement the minimal-user-
  # involvement browser tranche: automatic verification, session reuse,
  # verified resumption, consolidated interruptions and guarded workflows.
  # It preserves all existing authority boundaries and benchmark deferral.
  # ADR-0163 records the owner's 2026-10-06 continuation: focused region reads,
  # bounded text/control expansion, audited recovery reads, and owner sign-in
  # interruptions. This stays within the browser extension; no milestone or
  # release gate moves, and comparative benchmarks remain deferred.
  # ADR-0156 records the owner's 2026-09-30 instruction to implement the
  # self-hosted browser improvement program, independently within the
  # Milestone 10 browser tranche. Work begins with real-browser verification
  # and complete bounded observations; later packages remain pending.
  # ADR-0140 records the owner's non-milestone extension on 2026-09-28:
  # image.generate and video.generate use TensorScale behind a media port;
  # generated files reach Chat through the existing artifact attachment path;
  # its follow-up adds ordered image references for edits and first/last frames.
  # Milestones 12 through 15 were authorized in order on 2026-08-20
  # (ADR-0061); each begins with its detailed-design document and ADR.
  # Milestones 16 through 31 are independently authorized parallel
  # workstreams under ADRs 0069, 0070, 0071, 0072, 0073, 0077, 0079,
  # 0080, 0081, 0082, 0092, 0097, 0100, 0102, 0111, and 0112; their gates do not
  # advance the verified ceiling past the sequential work through 15.
  # ADR-0141 records the owner-authorized extension on 2026-09-28: task
  # approval website scopes are persisted on the server and managed from
  # native Website Access settings, without per-site deployment changes.
  # ADR-0142 records the owner-requested runtime repair on 2026-09-29: a
  # tool.call.denied payload (version 2) carries the result item the model was
  # given, and a version 1 denial without one projects from its recorded status,
  # tool name and reason code, labelled untrusted, so its session works again.
  # ADR-0089 authorizes a non-milestone extension to the existing schedule
  # control plane: current/recent-history browsing, thirty-day terminal
  # retention, and conditional native time-zone presentation.
  # ADR-0091 records the owner's non-milestone notification extension:
  # the pinned schedule title and nominal occurrence time may appear in alerts.
  # ADR-0109 records the owner's non-milestone repair to chat-created schedules:
  # pause on the second consecutive failure, a USD 5 budget with a synthesis
  # reserve, and a failure classification on the accounting event.
  # ADR-0113 records the owner's non-milestone native extension on 2026-09-21:
  # the sidebar groups scheduled sessions by schedule; folders stay chat-only.
  # ADR-0114 records a non-milestone CI change on 2026-09-21: main skips a
  # verification job whose exact source tree already passed it.
  # ADR-0116 records the owner's non-milestone repair on 2026-09-22: bulk mail
  # never forms communication memory; the census and the bulk verdict gate
  # formation and `agent email exclude-bulk` erases what already formed.
  # ADR-0117 records the owner's non-milestone extension on 2026-09-22: memory
  # review and deletion over HTTP under memory.write, superseding ADR-0070
  # decision 3, with the native review actions and the flagged filter.
  # ADR-0120 records the owner's non-milestone extension on 2026-09-23: files
  # attached to chat messages through a flagged upload route under
  # artifact.write, claimed on submit, sent to the model within a budget, and
  # owner-sent documents added to knowledge.
  # ADR-0115 records the owner's non-milestone runtime repair on 2026-09-21:
  # a tool batch is fitted to the remaining budget, an exhausted tool-call
  # budget owes one synthesis-only turn, and the interactive defaults carry
  # model-call and tool-call reserves (amends ADR-0078).
  # ADR-0119 records the owner's non-milestone extension on 2026-09-23: the
  # owner chooses the chat model, chat reasoning effort, and evaluated memory
  # model and effort from the client, under settings.read and settings.write.
  # ADR-0110 amends Milestone 29 on 2026-09-19: the typed-judgment port, the
  # TypeSafe Jev adapter and judgment folder matching, all default off, plus
  # an offline non-activating email-importance evaluation under Milestone 26.
  # ADR-0118 records the owner-authorized runtime repair on 2026-09-23:
  # normal continuations do not consume crash retries; exhausted queued runs
  # fail visibly and the migration preserves actual lease-expiration history.
  # ADR-0121 records the owner's non-milestone repair to Milestone 28 on
  # 2026-09-23: People admits only people the owner knows or writes to, mail
  # records correspondence whatever the account state, Needs review holds only
  # unconfirmed name-only people, and `agent people repair-directory` aligns
  # existing data; the People gate count is unchanged.
  # ADR-0122 records the owner's non-milestone extension on 2026-09-23: every
  # file a run exports rides on its reply and lives with the conversation,
  # artifact.export@2.0.0 also takes text without approval or a policy change,
  # and the native client copies formatted replies and selects any range.
  # ADR-0123 records the owner's non-milestone extension on 2026-09-25: Chat
  # defers tools past its thirty definitions to a deferred tool index reached
  # through the fifth control tool, tool.call; discovered tools rank reads
  # first; the default agent defers six management tools; skips are recorded.
  # ADR-0124 records the owner's non-milestone repair on 2026-09-23: the
  # default agent stops advertising workspace.list_files so Chat's thirty-item
  # roster fits all three calling tools with email unsubscribe on (amends
  # ADR-0105); the call gate enables every roster-changing production flag.
  # ADR-0125 records the owner's non-milestone extension to Milestone 28 on
  # 2026-09-25: groups, services and addresses never become people; duplicate
  # people merge automatically only on an owner-given endpoint a correspondent
  # also holds, and every name match becomes a suggestion the owner answers.
  # ADR-0126 records the owner's non-milestone extension to Milestone 28 on
  # 2026-09-25: each observed email exchange in People history carries a short
  # summary generated by the Email refresh from its verified retained passage,
  # withheld when a fact from that message is deleted, and people.history@1.1.0
  # names each email and reads its retained original text under email.read.
  # ADR-0127 records the owner's non-milestone extension to Milestone 10 on
  # 2026-09-25: a hosted browser lease renews in fifteen-minute steps for up to
  # an hour while its run is running, queued to resume, or parked on its own
  # approval, driven by the run worker's lease upkeep, which also releases
  # ended runs' leases.
  # ADR-0128 records the owner's non-milestone extension to Milestone 10 on
  # 2026-09-25: Website Access signs in on the owner's device and hands only
  # that site's session to the isolated service, which filters, verifies and
  # seals it; every sign-in advances the profile generation, ending its
  # grants; remote ceremonies no longer lose a finished sign-in. Amended
  # 2026-10-06: a verification that cannot finish logs which load stopped
  # it, at which stage and after how long, and nothing else.
  # ADR-0129 records the owner's non-milestone extension to the Milestone 10
  # browser tranche on 2026-09-25: a browser.act approval card names what it
  # acts on and, only inside an owner-configured site scope, can create a
  # session-bound, thirty-minute, two-hundred-action task grant that covers
  # unknown but never named consequences and is rechecked against the live
  # page; the browser gate count is unchanged.
  # ADR-0130 records the owner's non-milestone extension to Milestone 10 on
  # 2026-09-25: a chat bound to a website profile runs under a browser-task
  # budget (160 steps, 120 model calls, 160 tool calls, USD 30 with a USD 3
  # reserve) pinned by the default agent's version and always defines the three
  # browser tools; pages settle before they are observed, hidden nodes never
  # take an element slot, new evidence restarts the identical-call count at
  # most 32 times a run, and each request names the origins navigate accepts.
  # ADR-0131 records the owner's non-milestone latency repair on 2026-09-25:
  # full MCP catalog preparation pins the runtime's last live discovery of a
  # server and starts it on first use, the API and interactive worker warm that
  # memory at startup, model attempts and MCP handshakes are timed, and
  # `agent run latency` reports Chat latency from the event log. Amended
  # 2026-09-26: the warm-up starts one server at a time, waits longer than a
  # chat would, and retries, because every production warm-up had timed out;
  # the API starts it only once its socket is bound. Amended 2026-09-28: a
  # preparation writes its pins in one transaction.
  # ADR-0132 records the owner's non-milestone repair on 2026-09-25: scheduled
  # occurrences cache their context prefix with the one-hour TTL, other sessions
  # keep the default, the Anthropic adapter sends and orders the TTL, and
  # one-hour cache writes are priced and reserved at their own rate.
  # ADR-0133 records the owner's non-milestone CI change on 2026-09-26: the
  # reading-lane floor compares each commit's trailer with that commit's own
  # diff, a merge answers only for what it changed itself, and a range whose
  # newest trailer covers every changed path still passes.
  # ADR-0134 records the owner's non-milestone repair on 2026-09-26: a tool's
  # scope set serializes sorted, so a plan has one identity in every worker
  # process, and a plan hashed with its scopes unsorted is re-keyed in a new
  # epoch rather than re-planned.
  # ADR-0135 (Proposed, 2026-09-26) records the owner-requested OpenAI cache
  # repair: a hashed per-session cache key, discoverable history boundaries for
  # explicit OpenAI prompt caching, and priced cache-write usage.
  # ADR-0136 (Accepted, 2026-09-27) records a runtime repair: once a completed
  # batch leaves an identical-call counter one below its limit, the next model
  # turn is synthesis-only, so a repeating run still answers.
  # ADR-0137 (Proposed, 2026-09-27) records the owner-requested repair that
  # bounds each tool result's model-visible excerpt, 4,096 bytes by default,
  # and reports every context-pressure yield.
  # ADR-0138 (Proposed, 2026-09-28) records the browser repair that denies
  # web-created windows before creation and ends the browser session when a
  # popup cannot be confirmed closed.
  # ADR-0139 (Proposed, 2026-09-28) records the owner-requested cache repair:
  # completed active-run history precedes the fresh per-step context, so
  # recomputed recall no longer invalidates the cached tool history.
  # ADR-0143 records the owner's 2026-09-30 notification extension: a
  # thirty-second grace period, shared terminal-result receipts, foreground
  # suppression and server-authoritative cleanup of delivered native alerts.
  # ADR-0144 (Accepted, 2026-10-01) records the owner-requested progress
  # display: Chat runs ask OpenAI for reasoning summaries, and the Apple
  # client shows the latest summary heading while the model reasons.
  # ADR-0145 (Accepted, 2026-10-01) records the owner-requested repair to the
  # Milestone 10 browser tranche: run-attempt leases and both device sign-in
  # verification browsers run headed Chromium, as the remote ceremony does,
  # because a website can refuse a headless browser on every page; the
  # service admits at most three browsers at once and the browser container
  # allows 3 GiB and 1,024 processes; the gate count is unchanged.
  # ADR-0146 (Proposed, 2026-10-01) records the owner-requested follow-up: a
  # headed hosted browser no longer asks its vendor's services for anything
  # on its own, except one account listing as it starts, which has no
  # switch; the gate count is unchanged.
  # ADR-0152 (Accepted, 2026-10-05) records the owner-requested CI check that
  # follows it: hosted CI measures the built browser image's own requests on
  # x86_64 and arm64 whenever the image, its limits, the Playwright version or
  # the vendor-request switches change; the gate count is unchanged.
  # ADR-0153 (Proposed, 2026-10-05) records the owner-requested non-milestone
  # extension: a default-off first-party stdio bridge, svp_mcp, reads the
  # Scale VP data service's REST API with a grant it holds as a private
  # file, after a one-time operator sign-in; the gate count is unchanged. The
  # owner's sign-in and a live read smoke passed on 2026-10-05; production
  # enablement remains.
  # ADR-0154 (Accepted, 2026-10-06) records the owner's non-milestone native
  # extension: the schedule detail chooses a schedule's website access through
  # the existing full-definition update, amending ADR-0075's read-only browser
  # for that one control; the gate count is unchanged.
  # ADR-0155 (Accepted, 2026-10-07) records the owner's non-milestone
  # extension: after a completed reply, the maintenance role asks a model to
  # title a chat conversation from the owner's own messages, and to retitle it
  # only when the subject clearly moves; first-writer-wins titles become a
  # placeholder (conversation-titles.md); the gate count is unchanged.
