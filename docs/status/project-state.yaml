milestones:
  "0":
    title: Repository and engineering foundation
    status: complete
  "1":
    title: In-memory vertical slice
    status: complete
  "2":
    title: PostgreSQL persistence and durable worker
    status: complete
  "3":
    title: Model adapters (OpenAI, Anthropic, OpenAI-compatible) and normalized streaming
    status: complete
  "4":
    title: Policy, approvals, and complete tool lifecycle
    status: complete
  "5":
    title: HTTP API and SSE
    status: complete
  "6":
    title: Isolated execution and artifacts
    status: complete
  "7":
    title: Context budgeting and structured working state
    status: complete
  "8":
    title: Skills and MCP integration
    status: complete
  "9":
    title: Long-term memory and knowledge retrieval
    status: complete
  "10":
    title: Automatic memory, skills, public-web, and authenticated-browser tranches
    status: complete
    authorized_scope:
      - automatic memory formation and consolidation
      - skill.manage foreground authoring
      - governed background-review child runs
      - authoring metrics and evaluation evidence
      - provider-neutral public-web search and page extraction
      - provider-neutral authenticated browser automation
    deferred_scope:
      - model routing changes
      - general-purpose subagents and delegate.run
  "11":
    title: Scheduled runs
    status: complete
    authorized_scope:
      - one-time, daily, and weekly schedules with IANA time zones
      - immutable schedule revisions and occurrence history
      - governed occurrence materialization into ordinary durable runs
      - schedule lifecycle HTTP API and exact schedule scopes
      - bounded misfires, no-overlap execution, admission, and cost controls
      - offline occurrence and result retrieval
    deferred_scope:
      - arbitrary cron and monthly recurrence
      - dependency graphs and workflow DAGs
      - email and webhook notifications
      - continuous-session recurrence
  "12":
    title: Notifications and device identity
    status: in_progress
    authorized_on: 2026-08-20
    design: docs/plan/notifications-and-devices.md
    adr: docs/adr/0062-milestone-12-notifications-and-device-identity.md
    gates_registered: 20
    authorized_scope:
      - device registry with registration, refresh, revocation, and deletion
      - durable notification outbox written with the triggering event
      - least-privilege notify dispatcher role and APNs transport
      - approval, user-input, run-failure, and schedule-outcome triggers
      - content-free payloads, device and notification routes, offline inbox
      - Apple client registration, token upload, revocation, and deep links
    deferred_scope:
      - inbound surfaces, pairing, device-scoped tools, presence routing
      - actionable lock-screen approvals
      - email and webhook transports
  "13":
    title: General-purpose subagents and delegation
    status: authorized
    authorized_on: 2026-08-20
    design: docs/plan/subagents-and-delegation.md
    adr: docs/adr/0063-milestone-13-subagents-and-delegation.md
    gates_registered: 21
    authorized_scope:
      - delegate.run as a suspending control tool with a structured brief
      - dedicated child session and child run materialized in one transaction
      - derived child limits, scope and tool intersection, additive usage
      - parent suspension, join, cancellation and deadline propagation
      - capability scenario and two-arm case as the activation evidence
    deferred_scope:
      - handoffs, role-named agents, delegation deeper than one level
      - model routing changes
  "14":
    title: Inbound surfaces and pairing
    status: authorized
    authorized_on: 2026-08-20
    design: docs/plan/inbound-surfaces.md
    adr: docs/adr/0064-milestone-14-inbound-surfaces-and-pairing.md
    gates_registered: 21
    authorized_scope:
      - surface registry and a Telegram long-polling inbound adapter
      - pairing ceremony with one-time codes, lockout, and revocation
      - session-key resolver and ordinary run creation via the shared submit
      - replies, notifications, approvals, and questions over the chat
      - least-privilege surface role, rate limits, default-off flags
    deferred_scope:
      - Slack and email adapters, group and thread chats, webhook delivery
      - device-scoped tools, presence routing, hand-off, media intake
  "15":
    title: Operational hardening
    status: authorized
    authorized_on: 2026-08-20
    design: docs/plan/operational-hardening.md
    adr: docs/adr/0065-milestone-15-operational-hardening.md
    gates_registered: 16
    authorized_scope:
      - encrypted off-host daily backup with manifest and restore rehearsal
      - host health check with deduplicated alerts through the outbox
      - cloud and host firewall, SSH hardening, proxy rate limits
      - one-command code rollback and pre-migration dump
    deferred_scope:
      - high availability, off-host database, load balancer, rolling deploys
      - Kubernetes, microservices, a second queue

# Evidence for completed milestones 0 through 11 lives in
# docs/status/verification-history.yaml; an in-progress milestone's
# evidence stays here until it completes.
verification:
  history: docs/status/verification-history.yaml
  milestone_12:
    recorded_at: 2026-08-22T20:01:13Z
    status: in_progress
    evidence:
      - check: notification-domain and content-free-payload red-green cycle
        outcome: passed_locally
        detail: >-
          After the import-only scaffold made the behavioral test collect, the
          valid red run reported thirteen expected failures and ten passing
          boundary checks. The implemented domain slice now defines the closed
          device, provider, notification, delivery, subject-status, and severity
          vocabularies; validates kind-specific identifier sets, fixed titles,
          registry tool names, ops-only fields, aware lifecycle instants, push
          token secrecy, APNs and Telegram routing, revocation, outbox settlement,
          and delivery attempts; and constructs every declared deduplication key.
          All twenty-four focused tests pass.
      - check: first executable Milestone 12 gate
        outcome: passed_locally
        detail: >-
          gate.notify.content_free resolves to a twelve-member corpus containing
          message, argument, approval, question, failure, schedule, reasoning,
          traceback, API-key, bearer-token, and cookie-shaped content. Generated
          tests cover the deduplication-key rules, while gate.notify.dedupe stays
          pending until an outbox repository can prove one durable row under
          repeated triggers. The focused domain and gate-registry partition passes
          all forty-seven tests.
      - check: make check
        outcome: passed
        detail: >-
          Ruff formatting and linting over 520 files, strict mypy over 479 source
          and test files, 987 static tests, 324 contracts, deployment-script
          tests, 156 citation checks, and strict documentation builds pass. The
          gate registry contains 305 entries and retains 227 as the verified
          ceiling through Milestone 11 while Milestone 12 is in progress.
    remaining:
      - Implement the remaining six device and thirteen notification gates in the
        specification's build order, followed by the full Milestone 12 delivery
        verification.

