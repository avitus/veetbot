milestones:
  '32':
    title: Memory reconsolidation (dreaming)
    status: in_progress
    authorized_on: '2026-10-02'
    design: docs/plan/memory-reconsolidation.md
    design_status: specified
    adr: docs/adr/0169-milestone-32-memory-reconsolidation.md
    gates_registered: 24
    authorized_scope:
    - Periodically revisit the entire eligible memory bank within one tenant and principal through bounded resumable maintenance
    - Daily proposals and an authenticated web review page with individually approved production application; unattended application remains evidence-gated (owner authorized 2026-10-10, ADR-0174)
    - Merge equivalent beliefs, summarize related memories without losing atomic facts, and synthesize grounded tentative connections across sessions
    - Preserve provenance, evidence clocks, authority, portability, sensitivity, owner corrections and erasure; expose inspection and safe merge undo
    - Compare against existing maintenance using Milestone 16 and applicable Milestone 21 evidence before unattended activation
    deferred_scope:
    - Embeddings, external memory providers, learned memory policies, arbitrary multi-hop graph reasoning and external enrichment
    - New source admission, automatic persona edits, changes to People identity merge rules and automatic historical re-extraction
    open_items:
    - Resolve precision and answer-lift failures without repeating completed owner reviews; new hypothesis quality remains unverified under ADR-0170, and release-tuple proof is still required
    - Complete the once/dry-run operator controls and bind each remaining complete runtime gate to integrated evidence
    - Complete macOS Synthesis journeys and publish matching upstream, comparative and exact-revision release evidence before unattended production activation
    evidence:
    - check: Owner-reviewed daily dreaming implementation (2026-10-10, ADR-0174)
      outcome: implemented_pending_deployment
      detail: >-
        A separate default-off review flag composes one bounded daily provider slice,
        durable paused/due state and content-free run history. Locally validated
        operations remain pending until an authenticated, revision-bound owner
        approval makes them eligible for recall. Pending/rejected operations and
        legacy unapproved automatic operations stay out of reviewed recall. The
        private web page at /dreaming supports sources, explicit approval, rejection,
        merge undo, history and pause/resume with no browser credential storage.
        Original evidence, source privacy, expiry and erasure are unchanged.
        Migration ea3210a1b00c preserves this state and refuses destructive downgrade.
        Fabricated red assertions reproduced premature merge visibility, ineffective
        approval, missing daily claims, missing approval delta recall and pending
        merges replaying unchanged originals into session deltas; they pass
        after the corresponding store changes. The focused M32 suite passes 692
        tests in 38.67 seconds, with fourteen additional focused edge checks in
        1.74 seconds and a passing real Chromium approval/undo/rejection/reload flow.
        No frozen observations, owner judgments, evaluation thresholds or provider
        comparison artifacts changed. No live provider comparison was rerun for this
        owner-control change. Deployment and enabling the reviewed configuration in
        the API and maintenance roles remain; unattended quality remains failed.
    - check: Owner-authorized integration with current dev (2026-10-09)
      outcome: integrated_pending_quality_and_activation
      detail: >-
        The owner explicitly authorized integrating the entire unpublished M32
        implementation and renumbering its colliding ADRs. ADRs 0148, 0149 and
        0150 from that worktree are now 0169, 0170 and 0171; approval dates and
        decisions are unchanged. Frozen evaluation code, manifests, observations
        and human review artifacts retain their original bytes and identifiers.
        Integration preserves dev's completed Milestone 14 and all existing gates;
        the registry now has 595 entries, including M32's unchanged 24. The M32
        migration chain follows f7c4a2d9e681 and has one head, ea3210a1b00b.
        The combined focused M32, model-gateway and registry partition passes
        986 tests in 59.12 seconds wall time; the Apple package passes 704 tests in
        67.15 seconds. Full sidecar make check passes 5990 static tests (3 skipped),
        1483 contracts and 312 real-browser tests, plus website, deployment, lint,
        types and documentation. Its wall time is 691.65 seconds; make stages take
        687.062 seconds elapsed with 542.161 seconds of overlap. Browser tests are
        slowest at 596.247 seconds, followed by static tests at 438.049 seconds.
        UTF-8 PostgreSQL verification passes all 256 M32 cases and four existing
        title cases. Twelve migration checks pass across focused runs after direct
        repository fixtures bind the required transaction-local tenant context.
        The downgrade race now exercises both the original destructive-DDL guard
        and the later grounded-operation guard, preserving the original refusal
        and every history assertion. No production guard was relaxed. The recorded
        live comparison predates this integration and cannot authorize its release.
        No quality or activation gate is advanced; production dreaming stays off.
    - check: Connection classification and merge ranking repairs (2026-10-09)
      outcome: implemented_quality_still_failed
      detail: >-
        Five fabricated red assertions exposed hedged original copies admitted as
        connections, duplicate claims treated as distinct observations and a canonical
        merge discarding the best visible member's rank. Local connection admission
        and source-only proposal/verifier instructions now enforce the documented
        distinction between summaries and novel connections. Merge recall preserves
        the strongest visible score without changing canonical identity or evidence.
        The focused partition passes 840 tests, and eight comparison tests include
        a fabricated no-operation case with identical answer requests across arms.
        One preserved pre-bound comparison completed all 216 attempts with 408 calls,
        USD 3.53385250, no unknown usage and 862.20 seconds wall time against a USD 10
        ceiling. Original/merge/connection answer counts are 14/18/14 on development
        and 17/17/19 on holdout, each out of 36. Merge-answer nonregression passes;
        answer lift remains 0 and 5.56 percentage points, below the unchanged 10-point
        floor. False merges and lost facts stay zero and duplicate coverage is complete.
        Six development and five holdout hypotheses remain unverified in
        20261009-quality-review-v2; exact v1 wording matches remain zero. The owner
        subsequently stopped repeated review requests. This supplies no new judgments
        and does not reopen either completed owner review. Prior decisions,
        all ten historical artifacts, frozen controls, scoring rules and numeric floors
        are unchanged. A subsequent PostgreSQL optional-reader repair returns absence
        for a foreign tenant instead of propagating the guard's NotFoundError. That
        repair passes the existing regression plus 32 recall/history scenarios with
        RLS bypass disabled. Three migration/RLS checks pass with their required
        administrator setup and restricted-role assertions. The reader repair is
        outside this comparison's source digest; the recording is diagnostic and
        non-activating. The inspected holdout was not used for repair tuning.
        No gate or verified ceiling advances; production remains disabled.
    - check: Development recall and answer-failure diagnosis (2026-10-09)
      outcome: no_additional_recall_defect_reproduced
      detail: >-
        A provider-free replay seeded only the development runtime inputs and locally
        planned the six recorded development connections from the October 9 comparison.
        All six appeared in recall alongside their originals under the unchanged
        query, scope and token/item budget. This isolates the recall path; it does not
        rerun or validate proposal/verifier decisions and is not a new quality score.
        In the recorded connections arm, 14 of 36 development answers pass the frozen
        scorer. Of the 22 failures, 16 have supported content but extra answer wording;
        six concern information unavailable under the frozen scope or attribution.
        Both connection-bearing probes ask for facts already present in the originals.
        The observed development failure does not justify widening privacy, changing
        expected answers or tuning runtime output to inspected labels. No holdout
        details were inspected, no provider calls were made, and no observations,
        judgments, scoring rules or floors were changed. The latest precision remains
        unverified and answer lift still fails; production remains disabled.
    - check: ADR-0171 completed owner-data experiment and usefulness review (2026-10-09)
      outcome: owner_reviewed_useful
      detail: >-
        Experiment 95630466-a38b-4cdb-8291-2c147090b45b completed with four
        owner-confirmed inputs, one eligible related group, two model calls and
        one accepted related-memory summary in the disposable store. Settled
        provider usage was USD 0.03793375 against the USD 0.25 reservation.
        The owner reviewed the actual output and judged it useful. This completes
        the isolated experiment's owner review; private input/output remains
        outside the repository. It does not resolve legacy bank attribution,
        comparative quality failures or release gates, and production stays off.
    - check: ADR-0171 credential selection and failure receipts (2026-10-09)
      outcome: implemented
      detail: >-
        The owner instructed continuation after a failed experiment. The launcher
        now uses the application's canonical OpenAI credential before its alias
        and checks selected-model access without sending fixture text before opening
        a review. Red assertions reproduced wrong credential precedence, missing
        startup refusal and a real-adapter authentication error hidden by releasing
        unfinished groups. The isolated runner now completes those claims and
        preserves its finite execution reason, group count and call receipts without
        retrying. Fabricated tests cover precedence, whitespace, compatibility
        fallback, authentication/model/server refusal, network timeout and receipt
        retention. No production source admission or activation gate changes.
    - check: ADR-0171 review lifetime and submission consent (2026-10-09)
      outcome: implemented
      detail: >-
        The owner authorized removing review expiry. The local review now retains
        saved corrections, selections and results until explicit discard or process
        shutdown, including across refresh and tab closure. Run binds the current
        selected references and packet to a fresh submission; the runner refuses
        stale submissions without changing per-input evidence timestamps. Ninety-one
        fabricated-input cases pass across the fixture, review and preflight suites,
        including two-day waits, fresh/stale submission boundaries, selection
        mismatch, zero-spend refusal and shutdown disposal. Two red assertions first
        reproduced automatic deletion on access and startup. Browser checks verified
        saved correction/selection recovery, a fake-provider run after reopening,
        and result retention on refresh. No production or activation gate changes.
    - check: ADR-0171 compatibility preview and outcome explanations (2026-10-09)
      outcome: implemented
      detail: >-
        Thirty-one added fabricated-input cases cover the three-context selection,
        preview/inventory parity, zero-reservation refusal in both entry points,
        eligibility and sharing floors, correction invalidation, removal of a
        selection and distinct empty/error explanations. Red assertions reproduced
        the missing preview, a direct no-group execution that reserved budget, the
        absent removal route and an unexplained abstention. Browser checks confirmed
        blocked incompatible selections, recovery to a matching pair, corrections,
        a completed fake-provider run and layouts at 390 and 1280 pixels. This
        changes the isolated review only; production rules and quality gates remain.
    - check: ADR-0171 selected inputs and editable corrections (2026-10-08)
      outcome: implemented
      detail: >-
        Twelve added fabricated-input cases cover selecting three of four drafts,
        keeping unselected text out of storage/provider requests, the two-input
        minimum, editable corrections and fresh confirmation, classification and
        reference preservation, malformed/oversized and cross-origin requests,
        stale concurrent writes and refusal to edit a started experiment. Red
        tests reproduced subset refusal, the missing correction route and a
        stale correction overwriting newer text. Corrections affect only the
        isolated experiment; production admission and quality gates are unchanged.
    - check: ADR-0171 isolated runner and local review boundaries (2026-10-08)
      outcome: implemented
      detail: >-
        Thirty-two fabricated-input tests cover absent/changed/stale confirmation,
        source exclusions and egress, per-gesture timestamps and fresh identities,
        duplicate evidence, cross-owner and concurrent daily reservations, real
        proposal/verification and accepted writers, rejection/abstention, unknown
        usage, cancellation/timeout, loopback Host/Origin/capability controls,
        bounded commands, expiry, cancellation and one-time execution. Initial
        assertions reproduced absent confirmation refusals, missing reservations,
        unbounded concurrent admission, zero execution calls, unprotected review
        routes and a cancellation receipt that lost its attempted call count.
        No real owner input has been sent and no activation gate advances.
    - check: ADR-0171 owner approval (2026-10-08)
      outcome: authorized
      detail: >-
        The owner confirmed approval of ADR-0171 after clarification of its number.
        This authorizes an isolated owner-confirmed fixture evaluation path, not
        production changes or provider export. Exact-text confirmation naming the
        selected provider/model and USD 0.25 ceiling, implementation verification
        and durable experiment spending limits remain required before a live run.
        Legacy attribution refusal and all quality/release requirements remain.
    - check: owner authorization of broader memory reconsolidation
      outcome: authorized
      detail: >-
        On 2026-10-02 the owner said "Authorize that and propose a plan"
        for revisiting the entire memory bank, merging related beliefs and
        synthesizing new connections. This records scope authorization and
        a documentation-only proposal, not implementation or passing gates.
    - check: Phase 1 design and evaluation yardstick (2026-10-03)
      outcome: specified
      detail: >-
        The owner instructed engineering to begin. Detailed operation, store,
        migration, provider, lifecycle, API and native contracts now declare
        twenty-four registered gates. The first two bind the frozen corpus
        and transitive false-merge scorer checks; twenty-two runtime/release
        gates remain explicitly pending. Twenty-four synthetic cases split
        evenly between development and holdout, a pure deterministic scorer
        and a manifest pinning unchanged M16 controls establish the yardstick;
        no dreaming arm or production activation is claimed.
    - check: Phase 1 registry and scoring behavioral red tests
      outcome: observed_expected_failure
      detail: >-
        The focused registry grammar/count, census, maximum-bound and docs-plan
        tests failed at assertions because 568 entries lacked the 24 M32 gates,
        the bound was 31 and a missing M32 plan section was not rejected.
        The new scorer's transitive false-merge and duplicate-hypothesis tests
        failed because its initial empty score reported zero errors and zero
        denominators. The missing-pytest setup attempt is not red evidence.
    - check: Phase 2 durable maintenance foundation (2026-10-03)
      outcome: implemented
      detail: >-
