# Evidence for completed milestones 0 through 9 lives in
# docs/status/verification-history.yaml; the in-progress milestone's
# evidence stays here until it completes.
verification:
  history: docs/status/verification-history.yaml
  milestone_10:
    recorded_at: 2026-08-19T21:21:18Z
    status: in_progress
    evidence:
      - check: test-driven memory maturation gates
        outcome: passed_locally
        detail: >-
          The initial red run failed all six ordinary-conversation and lifecycle
          tests, the correction/topic expansion failed its two new cases, and an
          adversarial extractor failed both service-boundary cases. Review-driven
          red tests then exposed negated possessive duplication, generic
          preference collisions, pending-session starvation, inaccurate action
          counters, and the missing consolidation claim. A second hosted review
          drove four more red regressions for non-positive batch limits,
          independent clause and text-part boundaries, truthful overflow audits,
          and inferred-confidence authority. A third hosted review drove two
          further red cases for canonical preference reinforcement and complete
          audit reconciliation. The latest full review added red regressions for
          temporal-hint preservation, coordinated possessive retractions, the
          persisted formation deadline, and the formation-scan index. After the
          corresponding implementation steps, the next full review exposed a
          duplicate possessive proposal; its red audit-reconciliation regression
          now passes. A later PostgreSQL red regression proved that one malformed
          deadline could poison a sweep; malformed and timezone-naive deadlines
          are now rejected consistently. All 28 Milestone 10 memory gate tests
          pass.
      - check: routed rich memory extraction reference contract
        outcome: passed_locally
        detail: >-
          Five focused model-extraction tests prove that a strict-schema routed
          policy forms a relationship the deterministic grammar misses, records
          normalized usage in a content-free process event, rejects an
          unsupported named entity, falls back on malformed output, and rejects
          output beyond its dedicated budget. The existing memory formation,
          source-integrity, injection, candidate-cap, and no-policy-regression
          gates remain unchanged. Pending owner acceptance, the implementation
          provisionally applies ADR-0057's stricter composition boundary without
          claiming architectural acceptance: the reference extractor remains
          covered directly, while normal composition requires exact activation
          evidence. No provider credential was available for a live smoke test in
          this worktree.
      - check: Milestone 10A skill-authoring gates
        outcome: passed_locally
        detail: >-
          All six registered gates passed through eleven focused tests covering
          trust and exact scope denials, canonical bounded approvals, default-off
          construction, confined child reviews, non-fatal review failure,
          durable provenance and replay, optimistic conflicts, and the
          self-authored case 27 outcome change.
      - check: governed memory inspection surface
        outcome: passed_locally
        detail: >-
          Red tests first failed because consolidation audits, belief get, and
          trace inspection were unreachable. The implemented agent memory CLI
          now lists and gets full belief records, filters by source session,
          edits and deletes through the governed service, lists formation audits,
          and reads principal-scoped retrieval traces. All 55 focused unit and
          contract tests passed, and the PostgreSQL idle-formation integration
          proves session-filtered beliefs and audit counts survive the durable
          adapter.
      - check: evaluation-gated provider-assisted memory extraction
        outcome: passed_locally
        detail: >-
          Red tests first showed that activation accepted no evidence boundary,
          provider extraction had no implementation, composition could not select
          it, and an evidence-gathering build mode did not exist. The restricted
          maintenance extractor now makes one tool-free schema-constrained call,
          records content-free identity, policy, budget, deadline, usage, cost,
          source, and outcome audit data, falls back deterministically, and sends
          every proposal through the existing source and safety gates. Automatic
          startup selection activates matching operator or release-bundled
          evidence and otherwise retains deterministic formation; off and
          required modes preserve explicit no-resolution and fail-closed choices.
          The 24-case paired CLI evaluator derives the corpus and model tuple and
          creates no artifact unless lift, fabrication, and policy gates pass.
          Focused provider, evaluator, CLI, configuration, and
          review-remediation tests pass, including distinct candidate polarity,
          belief types, statements, and sources; dotted-number grounding; export
          consent handling; JSON export; and memory-list boundary validation.
      - check: formal memory gate and extractor contract reconciliation
        outcome: passed_locally
        detail: >-
          Red accounting tests first failed because the governed inspection and
          provider-assisted guarantees had no registry identities and only the
          deterministic extractor was named by the shared port contract. Six new
          Milestone 10 gates now cover principal-scoped inspection and mutation,
          all shipped extractor implementations, exact activation evidence,
          provider safety authority, audited deterministic fallback, and evidence
          publication. The extractor contract runs deterministic, model-assisted,
          and provider-assisted implementations against the same separate,
          scope-correct, provenance-bound proposal assertions, with both assisted
          paths forced through deterministic fallback. The registry reconciles at
          200 entries, including 34 at Milestone 10.
      - check: make check
        outcome: passed
        detail: >-
          Ruff formatting and linting, strict mypy over 439 source and test
          files, 717 static tests, 296 contracts, deployment-script checks,
          121 citation checks, and strict documentation builds pass on the
          integrated head. The static count includes the 25-case evaluation
          front end relocated from the DB-gated integration directory. The
          gate registry contains 200 entries and retains 166 as the verified
          ceiling through Milestone 9.
      - check: PostgreSQL integration and resilience partition
        outcome: passed
        detail: >-
          An isolated Compose PostgreSQL 16 database upgraded from empty through
          revision d2a6f8b1c304 and all 96 integration and resilience tests
          passed, including memory formation, durable skill-authoring approval
          and provenance, capability persistence, persisted web invocations and
          web-enabled recomposition, browser profile, authentication, and
          standing-grant persistence, transcript restoration, migrations, and
          re-composition.
      - check: default-off rollout boundary
        outcome: passed_locally
        detail: >-
          Foreground authoring and background review both default off;
          configuration refuses background review without foreground authoring,
          and skill.manage is absent from the registry until explicitly enabled.
      - check: provider-neutral web access contract
        outcome: passed_locally
        detail: >-
          The focused 112-test web partition covers shared Tavily and Firecrawl
          search/fetch contracts, domain and URL validation, capability-level
          composition, stable auth and retry failures, public-HTTPS fetch
          validation, fixed-target policy, default-off registration, bounded
          search output, the untrusted envelope reaching the next model step,
          same-turn trust escalation blocking memory writes, and persisted
          external-untrusted invocations with web-enabled recomposition on
          PostgreSQL. Seven formal gate.web entries cover that contract;
          `agent eval gates
          --milestone 10 --area web` reports seven passed, zero failed, and zero
          pending.
      - check: authenticated browser automation and formal gates
        outcome: passed_locally
        detail: >-
          `agent eval gates --milestone 10 --area browser` reports all ten
          provider, default-off, origin-isolation, observation-trust,
          revision-binding, action-authority, uncertain-write, profile-lifecycle,
          authentication, and standing-grant gates passed with zero failures or
          pending placeholders. The provider-neutral tools support bounded
          navigation, observation, and approval-governed actions through both
          ephemeral Playwright and hosted stateful providers. Stable handles,
          exact page revisions, trusted profile-origin binding, conservative
          consequence classification, effect watermarking, uncertain-outcome
          persistence, DNS-pinned egress, and external-untrusted observations
          preserve the documented authority and trust boundaries.

          The hosted control plane now provides generation-fenced profile
          lifecycle, leased sessions, a five-minute user-direct login ceremony,
          bounded interactive events and screenshots, durable authentication
          records, and exact routine-action standing grants. Public profile,
          authentication, and grant routes enforce their dedicated scopes; the
          execution pipeline re-runs deterministic policy before honoring a
          matching grant and records the authorization kind and reference.
          Profile material remains outside PostgreSQL in versioned AES-256-GCM
          envelopes whose authenticated metadata binds tenant, principal,
          profile generation, origin scope, format, revocation, and key version.
          The three browser tables use forced tenant RLS and migrations pass
          from an empty database through revision d2a6f8b1c304.

          The isolated service authenticates before bounded request buffering,
          accepts only private-file credentials and key material, returns bounded
          generic failures, and is the only additional approved process
          composition root for its secret-bearing package. Its production image
          installs Chromium and runs as uid 65532 with dropped capabilities,
          no-new-privileges, a read-only root, private secret mounts, resource
          limits, a separate outbound network, and only a loopback host binding
          behind the configured HTTPS reverse proxy. The production Compose
          overlay validates, the image builds, and an in-container Playwright
          smoke test launched Chromium 151.0.7922.34 as the unprivileged runtime
          user. A second smoke test ran the real service entry point as uid
          65532 with a read-only root, all capabilities dropped, and
          pre-provisioned private secret and material volumes; its authenticated
          control-plane flow provisioned a profile, acquired a lease, launched
          Chromium, navigated through the audited proxy to `https://example.org`,
          sealed the session, revoked the profile, and deleted its encrypted
          material. Release preflight validates the service-auth, session-secret,
          key, and HTTPS ceremony inputs and waits for service health.
      - check: Apple client and signing regression suite
        outcome: passed
        detail: >-
          All 82 Swift Testing cases passed, including complete historical
          transcript restoration, sidebar conversation navigation,
          forward-compatible message-role decoding, system composer sizing,
          connection-settings layout, and the missing-keychain-entitlement
          regression.
      - check: real-Docker sandbox security partition
        outcome: passed
        detail: All 10 sandbox security tests passed against a freshly built image.
      - check: accepted ADR-0051
        outcome: approved_and_implemented
        detail: >-
          The durable post-run flag, 30-second idle boundary, structured
          extractor port, source and scope rechecks, semantic conflict subjects,
          independently audited extractor and service caps, inferred-confidence
          ceiling, temporal-hint preservation, transactional replacement,
          formation-scan index, hybrid extractor reference implementation,
          content-free model-usage audit, deterministic fallback, and formation@3
          policy boundary are approved and implemented. ADR-0051 remains the
          accepted architecture. The implementation enforces proposed ADR-0057's
          stricter evidence gate while owner review is pending; ADR-0057 would
          supersede ADR-0051's unconditional routed-policy activation and provider
          budget only if accepted.
      - check: proposed ADR-0052
        outcome: owner_review_requested
        detail: >-
          The independently authorized tranche, invocation idempotency, durable
          provenance across session erasure, dedicated child-session placement,
          disabled-candidate activation, no-review-archive rule, and quantitative
          rollout threshold are recorded for owner review.
      - check: proposed ADR-0054
        outcome: owner_review_requested
        detail: >-
          The provider-neutral web port, capability-level provider selection,
          fixed HTTPS endpoints, external-untrusted labeling, and default-off
          registration are recorded for owner review.
      - check: accepted ADR-0055
        outcome: approved_and_implemented
        detail: >-
          The configurable CLI run wait with its positive-value boundary and
          300-second default is approved and implemented.
      - check: proposed ADR-0057
        outcome: owner_review_requested
        detail: >-
          The dedicated maintenance placement, exact evidence binding, fixed
          provider budget, user-episode selection, deterministic safety authority,
          content-free call audit, non-production evaluation mode, fallback, and
          formation@3 version boundary are recorded for owner review.
    remaining:
      - Run a labeled live-provider formation evaluation and activate the
        restricted extractor only when its version-bound evidence passes ADR-0057.
      - Record at least 30 paired rollout samples for each model-policy,
        policy-profile, and authoring-version combination; require at least five
        absolute percentage points of completion lift, a positive 95 percent
        Clopper-Pearson lower bound, and zero additional policy failures.
      - Run every hosted CI lane and complete the GitHub CodeRabbit review on
        the same final head, resolving every finding and conversation.
      - Design and separately authorize Milestone 11 scheduling; keep routing
        and subagent extensions independently gated.

