# documentation covers; it does not authorize work. Authorization is
# project.authorized_milestones above.
readiness:
  review: docs/plan/readiness.md
  summary: >-
    Milestones 0 through 4 are implementable from the corpus alone.
    Milestone 5 is implementable from Section 16 of the engineering plan
    but from no detailed-design specification. Milestones 6 through 10
    require design work that has not been done.
  implementable_from_corpus: [0, 1, 2, 3, 4]
  documents_required_before_coding_reaches_them:
    - subject: HTTP API and SSE
      blocks_milestone: 5
      expands: engineering-plan.md section 16
    - subject: Sandbox isolation
      blocks_milestone: 6
      expands: engineering-plan.md section 28
    - subject: Skills
      blocks_milestone: 8
      expands: engineering-plan.md section 30

