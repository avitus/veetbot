# Opt-in drop-in: API and trusted run workers only. See docs/integration-keys.md.
# Install the root-owned master key and the enablement env file before this drop-in.
[Service]
EnvironmentFile=/etc/veetbot/integration-secrets.env
LoadCredential=integration-secrets:/etc/veetbot/secrets/integration-secrets.key
Environment=INTEGRATION_SECRETS_KEY_FILE=%d/integration-secrets
