schema_version: 1
queue:
  poll_interval_seconds: 0.25
  max_attempts: 3
  priorities:
    interactive: 0
    async: 10
    maintenance: 20
worker:
  lease_seconds: 30.0
  heartbeat_divisor: 3
  reserved_interactive_slots: 1
  reserved_async_slots: 1
sweeps:
  reclaim_expired_seconds: 5
  approval_reaper_seconds: 30
  checkpoint_prune_seconds: 300
  projection_catch_up_seconds: 1
model:
  max_internal_attempts: 3
context:
  max_compactions_per_step: 2
run_defaults:
  max_steps: 32
  max_model_calls: 16
  max_tool_calls: 32
scheduling:
  scan_batch: 100
  fallback_poll_seconds: 30
  admission_backoff_seconds: 5
  max_run_timeout_seconds: 86400
  max_misfire_grace_seconds: 86400
  max_steps_per_run: 128
  max_model_calls_per_run: 64
  max_tool_calls_per_run: 256
  max_cost_per_run: 100
  max_active_runs_per_tenant: 4
  max_materializations_per_minute: 60
  daily_cost: 25
  monthly_cost: 250
notifications:
  claim_batch: 100
  lease_seconds: 30
  fallback_poll_seconds: 30
  retry_delays_seconds: [30, 120, 600, 3600]
  terminal_expiry_seconds: 86400
device:
  invocation_timeout_seconds: 300
  ingest_daily_cap: 500
  invocation_poll_seconds: 2
delegation:
  max_children_per_call: 3
  max_live_children_per_parent: 8
  max_depth: 1
  max_live_delegated_runs_per_tenant: 16
  child_max_steps: 12
  child_max_model_calls: 12
  child_max_tool_calls: 48
  child_max_cost: 2
  child_wall_seconds: 900
  synthesis_reserve_steps: 1
  synthesis_reserve_model_calls: 1
  synthesis_reserve_cost: 0.25
  summary_max_bytes: 16384
