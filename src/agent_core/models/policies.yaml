schema_version: 1
enabled_profiles: [openai, anthropic, ollama]
model_policies:
  balanced:
    provider: openai
    model: default
  flagship:
    provider: anthropic
    model: anthropic-default
  local:
    provider: ollama
    model: local-small
request_defaults:
  timeout_seconds: 600
  stream_idle_seconds: 60
  max_internal_attempts: 3
cache:
  expected_hit_ratio_floor: 0.9
