schema_version: 1
publication:
  # Commits the assistant and owner may make to one widget in an hour; a
  # rejected revision does not count (docs/plan/cockpit.md, rate limits).
  commits_per_widget_per_hour: 12
  # Commits across all of the principal's widgets in an hour.
  commits_per_principal_per_hour: 60
  # How often the maintenance role polls the widget branch for human commits.
  import_interval_seconds: 60
