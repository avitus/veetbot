schema_version: 1
publication:
  # Commits the assistant and owner may make to one widget in an hour; a
  # rejected revision does not count (docs/plan/cockpit.md, rate limits).
  commits_per_widget_per_hour: 12
  # Commits across all of the principal's widgets in an hour.
  commits_per_principal_per_hour: 60
  # How often the maintenance role polls the widget branch for human commits.
  import_interval_seconds: 60
  # How long cockpit.widget.write waits for the outbox to commit a change
  # before it reports pending_commit (docs/plan/cockpit.md, the tools).
  commit_wait_seconds: 30
stream:
  # A stream closes cleanly after this long, so a revoked token takes effect
  # on reconnect (docs/plan/cockpit.md, the stream).
  max_seconds: 600
  # How long stream events are kept; a client resuming from before this gets
  # stream.reset and refetches the snapshot.
  event_retention_seconds: 86400
feeds:
  # Snapshots kept per feed; a manifest declares at most this much history
  # (docs/plan/cockpit.md, freshness and delivery).
  history_max: 288
  # Days of history kept per feed; the smaller of this and history_max wins.
  history_days: 7
  # How often the maintenance role reads the platform's veetbot.* sources.
  projection_interval_seconds: 30
  # A quiet platform feed republishes its unchanged content this often, so its
  # freshness stays honest; it is also the feed's expected interval.
  refresh_seconds: 300
