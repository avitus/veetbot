schema_version: 1
name: default
default_effect: deny
rules:
  none:
    decision: allow
  workspace_read:
    condition: path_inside_workspace
    decision: allow
    otherwise: deny
  workspace_write:
    condition: path_inside_workspace
    decision: allow
    otherwise: deny
  network_read:
    condition: host_on_allowlist
    decision: allow
    otherwise: deny
  code_execution:
    condition: target_isolated
    decision: allow
    otherwise: deny
  package_install:
    decision: deny
  sandbox_network:
    decision: deny
  external_message:
    decision: require_approval
  external_write:
    decision: require_approval
  external_delete:
    decision: require_approval
  financial:
    decision: require_approval
  publication:
    decision: require_approval
  credential_access:
    decision: deny
  host_access:
    decision: deny
  privileged:
    decision: deny
tool_rules:
  # The iOS compose sheet shows the owner the recipient and the body, and the
  # Send tap that dispatches them is non-bypassable, so a second in-app approval
  # would duplicate rather than add control (ADR-0081, ADR-0083). The
  # external_message row above is unchanged for every other tool, and a turn
  # whose origin cannot authorize still escalates to an approval.
  device.sms.send:
    decision: allow
    human_confirms_arguments: true
unknown_tool:
  decision: deny
trust_overlay:
  external_untrusted_requires_approval: true
approval_expiry_seconds:
  low: 86400
  medium: 86400
  high: 14400
  critical: 3600
self_approval:
  enabled: true
advisory:
  enabled: false
