version: 2.1

parameters:
  run_live:
    type: boolean
    default: false

commands:
  install_uv:
    steps:
      - restore_cache:
          keys:
            - 'uv-v1-{{ arch }}-{{ checksum "uv.lock" }}'
            - 'uv-v1-{{ arch }}-'
      - run:
          name: Install uv
          command: |
            python -m pip install --user "uv==0.8.6"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install project
          command: make install
      - save_cache:
          key: 'uv-v1-{{ arch }}-{{ checksum "uv.lock" }}'
          paths:
            - ~/.cache/uv

jobs:
  static:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - install_uv
      - run:
          name: Install Pandoc
          command: sudo apt-get update && sudo apt-get install -y pandoc
      - run:
          name: Static checks
          command: make lint typecheck test-static docs-check

  contract:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - install_uv
      - run:
          name: Contract tests
          command: make test-contract

  integration:
    docker:
      - image: cimg/python:3.12
      - image: postgres:16-alpine
        environment:
          POSTGRES_DB: agent
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
    resource_class: small
    environment:
      DATABASE_URL: postgresql+asyncpg://agent:agent@localhost:5432/agent
    steps:
      - checkout
      - install_uv
      - run:
          name: Wait for PostgreSQL
          command: dockerize -wait tcp://localhost:5432 -timeout 60s
      - run:
          name: Migrations and integration tests
          command: make migrate test-integration

  live:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - install_uv
      - run:
          name: Live provider tests
          command: make test-live

workflows:
  verify:
    unless: << pipeline.parameters.run_live >>
    jobs:
      - static
      - contract
      - integration

  live_manual:
    when: << pipeline.parameters.run_live >>
    jobs:
      - live:
          context: live-model

  live_nightly:
    triggers:
      - schedule:
          cron: "17 7 * * *"
          filters:
            branches:
              only: main
    jobs:
      - live:
          context: live-model
