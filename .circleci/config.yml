version: 2.1

parameters:
  run_live:
    type: boolean
    default: false

commands:
  install_uv:
    steps:
      - restore_cache:
          keys:
            - 'uv-v1-{{ arch }}-{{ checksum "uv.lock" }}'
            - 'uv-v1-{{ arch }}-'
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/0.8.6/install.sh -o /tmp/uv-install.sh
            echo '6879d086185d40aa08dbbfb91f4c982badb563f1591939d8fa255efc6ee1f1cd  /tmp/uv-install.sh' | sha256sum --check --strict
            sh /tmp/uv-install.sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install project
          command: make install
      - save_cache:
          key: 'uv-v1-{{ arch }}-{{ checksum "uv.lock" }}'
          paths:
            - ~/.cache/uv

jobs:
  static:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - install_uv
      - run:
          name: Reading lane floor
          command: |
            READING_LANE_BASE="<< pipeline.git.base_revision >>" \
              uv run python -m scripts.check_reading_lane
      - run:
          name: Install Pandoc
          command: sudo apt-get update && sudo apt-get install -y pandoc
      - run:
          name: Static checks
          command: make lint typecheck test-static test-deploy docs-check
      - run:
          name: Build downloadable client
          command: make client-build
      - store_artifacts:
          path: build/veetbot-client.pyz
          destination: veetbot-client.pyz

  contract:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - install_uv
      - run:
          name: Contract tests
          command: make test-contract

  integration:
    docker:
      - image: cimg/python:3.12
      - image: postgres:16-alpine
        environment:
          POSTGRES_DB: agent
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
    resource_class: small
    environment:
      DATABASE_URL: postgresql+asyncpg://agent:agent@localhost:5432/agent
    steps:
      - checkout
      - install_uv
      - run:
          name: Wait for PostgreSQL
          command: dockerize -wait tcp://localhost:5432 -timeout 60s
      - run:
          name: Migrations and integration tests
          command: make migrate test-integration

  sandbox:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - install_uv
      - run:
          name: Real-runtime sandbox security gates
          command: make test-sandbox

  apple:
    macos:
      xcode: "26.6.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Native Apple client tests
          command: make test-apple
      - run:
          name: Apple client UI tests
          command: make test-apple-ui

  apple-testflight:
    macos:
      xcode: "26.6.0"
      code_signing:
        - veetbot-app-store
        - veetbot-mac-installer
    resource_class: m4pro.medium
    steps:
      - install_signing_bundle
      - checkout
      - run:
          name: Archive and upload the macOS client to TestFlight
          command: |
            set -euo pipefail
            : "${APP_STORE_CONNECT_API_KEY_BASE64:?set APP_STORE_CONNECT_API_KEY_BASE64 in the veetbot-apple-testflight context}"
            : "${APP_STORE_CONNECT_API_KEY_ID:?set APP_STORE_CONNECT_API_KEY_ID in the veetbot-apple-testflight context}"
            : "${APP_STORE_CONNECT_ISSUER_ID:?set APP_STORE_CONNECT_ISSUER_ID in the veetbot-apple-testflight context}"
            [[ "$APP_STORE_CONNECT_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
            [[ "$APP_STORE_CONNECT_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]

            apple_build_number="<< pipeline.number >>"
            [[ "$apple_build_number" =~ ^[1-9][0-9]*$ ]]

            testflight_dir="build/testflight"
            archive_path="$testflight_dir/Veetbot-macOS.xcarchive"
            pkg_path="$testflight_dir/Veetbot.pkg"
            temporary_root="${TMPDIR:-/tmp}"
            asc_auth_dir="$(mktemp -d "${temporary_root%/}/veetbot-app-store-key.XXXXXX")"
            asc_auth_file="$asc_auth_dir/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
            cleanup_asc_auth() {
              rm -f -- "$asc_auth_file"
              rmdir "$asc_auth_dir"
            }
            trap cleanup_asc_auth EXIT
            umask 077
            mkdir -p "$testflight_dir"
            printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" \
              | base64 --decode > "$asc_auth_file"
            test -s "$asc_auth_file"

            installer_certificate_sha1="$(
              security find-certificate -a -c "3rd Party Mac Developer Installer" -Z \
                | awk '/^SHA-1 hash: / {print $3}'
            )"
            [[ "$installer_certificate_sha1" =~ ^[A-F0-9]{40}$ ]]

            xcodebuild archive \
              -project clients/apple/Veetbot.xcodeproj \
              -scheme Veetbot \
              -configuration Release \
              -destination "generic/platform=macOS" \
              -archivePath "$archive_path" \
              CURRENT_PROJECT_VERSION="$apple_build_number" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="Veetbot Mac App Store"

            app_path="$archive_path/Products/Applications/Veetbot.app"
            app_info="$app_path/Contents/Info.plist"
            archived_build_number="$(
              /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_info"
            )"
            archived_bundle_id="$(
              /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_info"
            )"
            test "$archived_build_number" = "$apple_build_number"
            test "$archived_bundle_id" = "com.veetbot.apple"
            codesign --verify --deep --strict --verbose=2 "$app_path"

            productbuild \
              --sign "$installer_certificate_sha1" \
              --component "$app_path" /Applications \
              "$pkg_path"
            test -s "$pkg_path"
            pkgutil --check-signature "$pkg_path"

            xcrun altool --upload-app \
              --file "$pkg_path" \
              --type macos \
              --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --p8-file-path "$asc_auth_file" \
              --show-progress \
              --verbose

  live:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - install_uv
      - run:
          name: Live provider tests
          command: make test-live

  package-release:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - install_uv
      - run:
          name: Package immutable application and documentation release
          command: |
            mkdir -p build/release
            release_id="$(date -u +%Y%m%d-%H%M%S)-${CIRCLE_SHA1:0:7}"
            printf '%s\n' "$release_id" > build/release/release-id
            git archive --format=tar.gz \
              --output=build/release/veetbot-server.tar.gz "$CIRCLE_SHA1"
            uv run --frozen --only-group docs mkdocs build --strict
            printf '%s\n' "$release_id" > site/release.txt
            tar -czf build/release/veetbot-docs.tar.gz -C site .
            cd build/release
            sha256sum veetbot-server.tar.gz > veetbot-server.tar.gz.sha256
            sha256sum veetbot-docs.tar.gz > veetbot-docs.tar.gz.sha256
      - persist_to_workspace:
          root: build/release
          paths:
            - veetbot-server.tar.gz
            - veetbot-server.tar.gz.sha256
            - veetbot-docs.tar.gz
            - veetbot-docs.tar.gz.sha256
            - release-id

  deploy-app:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/veetbot-release
      - add_ssh_keys:
          fingerprints:
            - "SHA256:vt3iKfD3dv6dxtjS+Tre6B1EH6408yvMHFrMpp64sao"
      - run:
          name: Configure deployment SSH trust
          command: |
            : "${DEPLOY_HOST:?set DEPLOY_HOST in the veetbot-production context}"
            : "${DEPLOY_USER:?set DEPLOY_USER in the veetbot-production context}"
            : "${DEPLOY_KNOWN_HOSTS:?set DEPLOY_KNOWN_HOSTS in the veetbot-production context}"
            install -d -m 0700 "$HOME/.ssh"
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 0600 "$HOME/.ssh/known_hosts"
            release_id="$(cat /tmp/veetbot-release/release-id)"
            [[ "$release_id" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7,40}$ ]]
            printf 'export VEETBOT_RELEASE_ID=%q\n' "$release_id" >> "$BASH_ENV"
      - run:
          name: Stage and release application
          command: |
            stage="/opt/veetbot/releases/$VEETBOT_RELEASE_ID"
            set +e
            ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "if grep -Fqx 'VEETBOT_RELEASE_ID=$VEETBOT_RELEASE_ID' \
                 /opt/veetbot/current/.release.env 2>/dev/null; then \
                 exit 42; \
               fi; \
               mkdir -p '$stage'"
            stage_status=$?
            set -e
            if [[ "$stage_status" == 42 ]]; then
              echo "$VEETBOT_RELEASE_ID is already active; verifying it without restaging."
            elif [[ "$stage_status" != 0 ]]; then
              exit "$stage_status"
            else
              scp -P "${DEPLOY_PORT:-22}" \
                /tmp/veetbot-release/veetbot-server.tar.gz \
                /tmp/veetbot-release/veetbot-server.tar.gz.sha256 \
                "$DEPLOY_USER@$DEPLOY_HOST:$stage/"
              ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
                "cd '$stage' || exit 1; \
                 if ! sha256sum --check veetbot-server.tar.gz.sha256 || \
                    ! tar -xzf veetbot-server.tar.gz; then \
                   cd / && rm -rf -- '$stage'; exit 1; \
                 fi; \
                 rm -f veetbot-server.tar.gz veetbot-server.tar.gz.sha256; \
                 bash deploy/app/release.sh '$VEETBOT_RELEASE_ID'"
            fi
      - run:
          name: Verify public release identity
          command: |
            production_url="${PRODUCTION_URL:-https://api.veetbot.com}"
            headers="$(mktemp)"
            trap 'rm -f "$headers"' EXIT
            attempt=0
            max_attempts=10
            while (( attempt < max_attempts )); do
              attempt=$((attempt + 1))
              : >"$headers"
              if curl --fail --silent --show-error \
                   --connect-timeout 5 --max-time 15 \
                   --dump-header "$headers" --output /dev/null \
                   "$production_url/health/ready" \
                 && awk -F ': *' -v expected="$VEETBOT_RELEASE_ID" '
                      BEGIN { IGNORECASE = 1 }
                      tolower($1) == "x-veetbot-release" {
                        sub(/\r$/, "", $2)
                        if ($2 == expected) found = 1
                      }
                      END { exit found ? 0 : 1 }
                    ' "$headers"; then
                exit 0
              fi
              if (( attempt < max_attempts )); then
                sleep 5
              fi
            done
            echo "production did not report release $VEETBOT_RELEASE_ID" >&2
            exit 1

  deploy-nginx:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/veetbot-release
      - add_ssh_keys:
          fingerprints:
            - "SHA256:vt3iKfD3dv6dxtjS+Tre6B1EH6408yvMHFrMpp64sao"
      - run:
          name: Configure deployment SSH trust
          command: |
            : "${DEPLOY_HOST:?set DEPLOY_HOST in the veetbot-production context}"
            : "${DEPLOY_USER:?set DEPLOY_USER in the veetbot-production context}"
            : "${DEPLOY_KNOWN_HOSTS:?set DEPLOY_KNOWN_HOSTS in the veetbot-production context}"
            install -d -m 0700 "$HOME/.ssh"
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 0600 "$HOME/.ssh/known_hosts"
      - run:
          name: Validate and reload Nginx
          command: |
            expected_release_id="$(cat /tmp/veetbot-release/release-id)"
            [[ "$expected_release_id" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7,40}$ ]]
            remote_config="/tmp/veetbot-nginx-$CIRCLE_SHA1.conf"
            remote_script="/tmp/veetbot-nginx-$CIRCLE_SHA1.sh"
            remote_docs_dir="/tmp/veetbot-docs-$CIRCLE_SHA1"
            remote_docs="$remote_docs_dir/veetbot-docs.tar.gz"
            remote_docs_checksum="$remote_docs.sha256"
            deployment_outcome="/tmp/veetbot-release/nginx-deployment-outcome"
            rm -f "$deployment_outcome"
            scp -P "${DEPLOY_PORT:-22}" nginx/veetbot.conf \
              "$DEPLOY_USER@$DEPLOY_HOST:$remote_config"
            scp -P "${DEPLOY_PORT:-22}" deploy/nginx/deploy.sh \
              "$DEPLOY_USER@$DEPLOY_HOST:$remote_script"
            ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "install -d -m 0700 '$remote_docs_dir'"
            scp -P "${DEPLOY_PORT:-22}" \
              /tmp/veetbot-release/veetbot-docs.tar.gz \
              "$DEPLOY_USER@$DEPLOY_HOST:$remote_docs"
            scp -P "${DEPLOY_PORT:-22}" \
              /tmp/veetbot-release/veetbot-docs.tar.gz.sha256 \
              "$DEPLOY_USER@$DEPLOY_HOST:$remote_docs_checksum"
            if ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "VEETBOT_EXPECTED_RELEASE_ID='$expected_release_id' \
                 bash '$remote_script' '$remote_config' '$remote_docs' \
                   '$remote_docs_checksum'; \
               status=\$?; \
               rm -f '$remote_script' '$remote_config' '$remote_docs' \
                 '$remote_docs_checksum'; \
               rmdir '$remote_docs_dir' 2>/dev/null || true; \
               exit \$status"; then
              printf 'published\n' >"$deployment_outcome"
            else
              deployment_status=$?
              if [[ "$deployment_status" == 3 ]]; then
                printf 'stale\n' >"$deployment_outcome"
              else
                exit "$deployment_status"
              fi
            fi
      - run:
          name: Verify public documentation release
          command: |
            expected_release_id="$(cat /tmp/veetbot-release/release-id)"
            deployment_outcome="$(cat /tmp/veetbot-release/nginx-deployment-outcome)"
            if [[ "$deployment_outcome" == stale ]]; then
              echo "Skipping documentation identity probe for stale release $expected_release_id"
              exit 0
            fi
            [[ "$deployment_outcome" == published ]]
            docs_url="${DOCS_URL:-https://docs.veetbot.com}"
            attempt=0
            max_attempts=10
            while (( attempt < max_attempts )); do
              attempt=$((attempt + 1))
              if release_id="$(curl --fail --silent --show-error \
                   --connect-timeout 5 --max-time 15 \
                   "$docs_url/release.txt")" \
                 && [[ "$release_id" == "$expected_release_id" ]]; then
                exit 0
              fi
              if (( attempt < max_attempts )); then
                sleep 5
              fi
            done
            echo "documentation did not report release $expected_release_id" >&2
            exit 1

workflows:
  verify:
    unless: << pipeline.parameters.run_live >>
    jobs:
      - static
      - contract
      - integration
      - sandbox
      - apple
      - package-release:
          requires:
            - static
            - contract
            - integration
            - sandbox
            - apple
          filters:
            branches:
              only: main
      - deploy-app:
          context: veetbot-production
          serial-group: << pipeline.project.slug >>/veetbot-production
          requires:
            - package-release
          filters:
            branches:
              only: main
      - deploy-nginx:
          context: veetbot-production
          serial-group: << pipeline.project.slug >>/veetbot-production
          requires:
            - deploy-app
          filters:
            branches:
              only: main
      - apple-testflight:
          context: veetbot-apple-testflight
          serial-group: << pipeline.project.slug >>/veetbot-apple-testflight
          requires:
            - deploy-app
          filters:
            branches:
              only: main

  live_manual:
    when: << pipeline.parameters.run_live >>
    jobs:
      - live:
          context: live-model

  live_nightly:
    triggers:
      - schedule:
          cron: "17 7 * * *"
          filters:
            branches:
              only: main
    jobs:
      - live:
          context: live-model
