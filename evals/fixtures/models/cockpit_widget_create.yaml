turns:
- tool_calls:
  - name: cockpit.read
    arguments:
      operation: describe_kit
    call_id: cockpit-kit
  stop_reason: tool_use
- tool_calls:
  - name: cockpit.widget.write
    arguments:
      operation: create
      slug: approvals-waiting
      files:
        fixtures/empty.json: |
          {
            "now": "2026-10-22T18:00:00Z",
            "settings": {},
            "feeds": {
              "veetbot.approvals.pending": {
                "observedAt": "2026-10-22T17:58:30Z",
                "expectedIntervalSec": 300,
                "data": {
                  "count": 0,
                  "oldestAt": null,
                  "items": []
                }
              }
            }
          }
        fixtures/stale.json: |
          {
            "now": "2026-10-22T18:00:00Z",
            "settings": {},
            "feeds": {
              "veetbot.approvals.pending": {
                "observedAt": "2026-10-22T17:00:00Z",
                "expectedIntervalSec": 300,
                "data": {
                  "count": 1,
                  "oldestAt": "2026-10-22T16:52:00Z",
                  "items": [
                    {
                      "id": "00000000-0000-4000-8000-0000000000a1",
                      "sessionId": "00000000-0000-4000-8000-0000000000b1",
                      "kind": "Website",
                      "summary": "Reserve the weekend cabin on its booking page",
                      "requestedAt": "2026-10-22T16:52:00Z",
                      "expiresAt": "2026-10-23T16:52:00Z",
                      "risk": "high"
                    }
                  ]
                }
              }
            }
          }
        fixtures/typical.json: |
          {
            "now": "2026-10-22T18:00:00Z",
            "settings": {},
            "feeds": {
              "veetbot.approvals.pending": {
                "observedAt": "2026-10-22T17:58:30Z",
                "expectedIntervalSec": 300,
                "data": {
                  "count": 2,
                  "oldestAt": "2026-10-22T17:42:00Z",
                  "items": [
                    {
                      "id": "00000000-0000-4000-8000-0000000000a1",
                      "sessionId": "00000000-0000-4000-8000-0000000000b1",
                      "kind": "Website",
                      "summary": "Reserve the weekend cabin on its booking page",
                      "requestedAt": "2026-10-22T17:42:00Z",
                      "expiresAt": "2026-10-23T17:42:00Z",
                      "risk": "high"
                    },
                    {
                      "id": "00000000-0000-4000-8000-0000000000a2",
                      "sessionId": "00000000-0000-4000-8000-0000000000b2",
                      "kind": "Text message",
                      "summary": "Move the appointment to Tuesday",
                      "requestedAt": "2026-10-22T17:56:00Z",
                      "expiresAt": "2026-10-23T17:56:00Z",
                      "risk": "medium"
                    }
                  ]
                }
              }
            }
          }
        widget.json: |
          {
            "schema": 1,
            "slug": "approvals-waiting",
            "title": "Approvals",
            "purpose": "Shows how many approvals are waiting on the owner and the oldest of them.",
            "kit_api": 1,
            "sizes": ["sm", "md"],
            "feeds": [{ "id": "veetbot.approvals.pending" }],
            "settings": { "type": "object", "additionalProperties": false, "properties": {} }
          }
        widget.tsx: |
          import { List, Metric, Row, Split, Tile, useNow } from '@veetbot/cockpit-kit';
          import type { WidgetProps } from '@veetbot/cockpit-kit';

          interface Approval {
            id: string;
            sessionId: string | null;
            kind: string;
            summary: string;
            requestedAt: string;
            expiresAt: string;
            risk: string;
          }

          interface Pending {
            count: number;
            oldestAt: string | null;
            items: Approval[];
          }

          export default function ApprovalsWaiting({ feeds, size }: WidgetProps) {
            const now = useNow();
            const feed = feeds['veetbot.approvals.pending'];
            const pending = feed?.data as Pending | null | undefined;
            const count = pending?.count ?? 0;
            const minutes = (at: string) => Math.max(0, Math.round((now - Date.parse(at)) / 60_000));
            const figure = (
              <Metric
                value={pending ? count : null}
                size="l"
                tone={count > 0 ? 'attention' : 'default'}
                label={pending?.oldestAt != null ? `Oldest ${minutes(pending.oldestAt)} min` : 'Nothing waiting'}
              />
            );
            return (
              <Tile title="Approvals" freshness={feed} attention={count > 0 ? `${count} waiting on you` : null}>
                {size === 'sm' || !pending || count === 0 ? (
                  figure
                ) : (
                  <Split>
                    {figure}
                    <List more={Math.max(0, count - pending.items.length)}>
                      {pending.items.map((item, index) => (
                        <Row
                          key={index}
                          marker="attention"
                          title={item.kind}
                          detail={item.summary}
                          meta={`${minutes(item.requestedAt)} min`}
                          opens={{ kind: 'approval', id: item.id }}
                        />
                      ))}
                    </List>
                  </Split>
                )}
              </Tile>
            );
          }
    call_id: cockpit-write
  stop_reason: tool_use
- text: The Approvals widget is published; it shows on your Cockpit once its commit lands.
  stop_reason: end_turn
