task: >-
  As of August 25, 2026, evaluate six hosted authenticated-browser automation
  platforms suitable for Veetbot: Browserbase, Browser Use Cloud,
  Hyperbrowser, Steel, Playwright's hosted ecosystem, and one additional
  credible provider you discover. For each platform, verify from current
  primary sources: persistent authenticated-profile support; credential and
  cookie isolation; CAPTCHA and MFA handling boundaries; session recording
  and data retention; regional hosting and data residency; API and Playwright
  compatibility; concurrency limits; current pricing for 1,000 browser-hours
  per month; and SOC 2 or equivalent security claims. Cross-check every
  security, pricing, and retention claim against a second source. Identify
  contradictions, stale documentation, and facts that could not be verified.
  Produce a normalized comparison table, rank the providers for Veetbot's
  governed browser architecture, and make a recommendation with citations. Do
  not infer missing facts.
