# Canonical gate registry entries for Milestone 11 scheduling.
- id: gate.schedule.not_early
  milestone: 11
  kind: property
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**A future occurrence never fires early.** Generated one-time, daily, and weekly definitions over many zones produce no occurrence whose materialized time precedes its nominal UTC instant."
  check: tests/gates/test_schedule_m11.py::test_future_occurrences_are_never_early
- id: gate.schedule.materialize_once
  milestone: 11
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Concurrent schedulers materialize once.** Two schedule workers racing on one due definition commit exactly one occurrence, session, run, checkpoint, and creation-event sequence."
  check: tests/integration/test_schedule_materializer_m11.py::test_concurrent_schedulers_materialize_once
- id: gate.schedule.materialize_atomic
  milestone: 11
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Occurrence creation is atomic across a crash.** No injected pre-commit crash leaves partial state, and a post-commit retry returns the one complete linked occurrence and run."
  check: tests/integration/test_schedule_materializer_m11.py::test_materialization_rolls_back_at_every_write_boundary_and_retries
- id: gate.schedule.civil_time
  milestone: 11
  kind: property
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Civil-time recurrence is deterministic.** Generated IANA-zone cases obey the declared gap and fold rules and reconstruct the same next firing."
  check: tests/gates/test_schedule_m11.py::test_civil_time_recurrence_is_deterministic
- id: gate.schedule.misfire_bounded
  milestone: 11
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Downtime catch-up is bounded.** A scan across thousands of missed instants creates at most one occurrence and one bounded coalescing event."
  check: tests/gates/test_schedule_materialization_m11.py::test_downtime_coalesces_thousands_of_misfires_without_backlog_iteration
- id: gate.schedule.no_overlap
  milestone: 11
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Occurrences from one schedule never overlap.** A due instant behind a non-terminal linked run is skipped once without blocking a different schedule."
  check: tests/integration/test_schedule_materializer_m11.py::test_nonterminal_occurrence_skips_overlap_without_blocking_other_schedule
- id: gate.schedule.authority_fresh
  milestone: 11
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Firing revalidates current authority.** Revoked scopes and disabled principals fail closed before any session or run is created."
  check: tests/gates/test_schedule_materialization_m11.py::test_firing_revalidates_current_authority
- id: gate.schedule.scope_isolated
  milestone: 11
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Scheduled execution uses exactly its requested scopes.** Runs receive only the requested subset, undeclared tools are denied, and schedule reads are principal isolated."
  check: tests/gates/test_schedule_materialization_m11.py::test_due_schedule_materializes_one_complete_ordinary_run
- id: gate.schedule.revision_pinned
  milestone: 11
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**A revision pins reproducible execution inputs.** Past occurrences retain their exact agent, policy, instruction, scope, cadence, and limit revision after an update."
  check: tests/gates/test_schedule_lifecycle_m11.py::test_revision_updates_only_future_occurrences_and_cancel_leaves_run_unchanged
- id: gate.schedule.lifecycle_linear
  milestone: 11
  kind: property
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Lifecycle races are linearized.** Generated mutation and due-scan interleavings reduce to an allowed serial history with no terminal reopen or paused-time backfill."
  check: tests/gates/test_schedule_lifecycle_m11.py::test_generated_lifecycle_histories_never_reopen_or_backfill
- id: gate.schedule.cancel_separate
  milestone: 11
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Schedule cancellation and run cancellation are separate.** Cancelling a schedule stops future occurrences and leaves a materialized run unchanged."
  check: tests/gates/test_schedule_lifecycle_m11.py::test_revision_updates_only_future_occurrences_and_cancel_leaves_run_unchanged
- id: gate.schedule.run_bounded
  milestone: 11
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Every scheduled run is bounded.** Required finite limits and a derived deadline are stamped on each run and enforced by the ordinary runtime."
  check: tests/gates/test_schedule_materialization_m11.py::test_due_schedule_materializes_one_complete_ordinary_run
- id: gate.schedule.priority_fair
  milestone: 11
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Scheduled load cannot starve interactive work.** Reserved worker capacity bounds interactive claim latency while retaining async progress."
  check: tests/integration/test_schedule_worker_postgres_m11.py::test_reserved_worker_classes_preserve_interactive_and_async_progress
- id: gate.schedule.offline_results
  milestone: 11
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**A client can recover every result while offline.** Occurrence history returns every disposition and exact durable run link without transient notifications."
  check: tests/gates/test_schedule_api_m11.py::test_offline_occurrence_history_paginates_every_disposition_and_run_link
- id: gate.schedule.no_credentials
  milestone: 11
  kind: corpus
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**No credential becomes schedule state.** Domain and persistence models have no credential fields, and credential-shaped instructions are rejected without storing or logging the match."
  check: tests/gates/test_schedule_credentials_m11.py::test_credential_shaped_instructions_are_rejected_without_storage_or_logging
  corpus: tests/corpora/schedule_credentials
  minimum_members: 12
- id: gate.schedule.domain_invariants
  milestone: 11
  kind: property
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Schedule values preserve their invariants.** Generated definitions, revisions, and occurrences either validate into a complete legal value or fail with a stable validation error."
  check: tests/gates/test_schedule_m11.py::test_schedule_domain_validation_is_total
- id: gate.schedule.repository_contract
  milestone: 11
  kind: structural
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Every scheduling port has executable adapter contracts.** Definition, occurrence, and request-idempotency protocols each have a named shared contract exercised by every registered adapter."
  check: tests/gates/test_contract_coverage.py::test_contract_coverage
- id: gate.schedule.persistence_schema
  milestone: 11
  kind: structural
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**The scheduling schema encodes its trust boundaries.** Keys, uniqueness, immutable revisions, nullable-link rules, indexes, foreign keys, erasure evidence, and row-level security are present in metadata."
  check: tests/unit/test_persistence_schema.py::test_schedule_tables_encode_identity_erasure_and_query_constraints
- id: gate.schedule.migration_clean
  milestone: 11
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Scheduling migrates cleanly from an empty database.** The full migration chain reaches head and exactly matches declared metadata."
  check: tests/integration/test_migrations.py::test_migrations_upgrade_cleanly_and_match_metadata
- id: gate.schedule.migration_stepwise
  milestone: 11
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**The scheduling migration is reversible at its boundary.** Upgrade, downgrade, and re-upgrade from the immediate predecessor preserve a valid schema."
  check: tests/integration/test_migrations.py::test_migrations_round_trip_each_step_from_its_predecessor
- id: gate.schedule.uow_atomic
  milestone: 11
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Scheduling repositories share the application transaction.** Definition, revision, occurrence, and idempotency writes commit or roll back together through the ordinary unit of work."
  check: tests/integration/test_schedule_persistence_m11.py::test_schedule_repositories_commit_and_roll_back_as_one_unit
- id: gate.schedule.erasure_audited
  milestone: 11
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Session erasure preserves an explicit occurrence audit state.** Deletion atomically marks the materialized link erased and clears nullable session and run links before deleting their graph, without retaining erased content."
  check: tests/integration/test_schedule_persistence_m11.py::test_session_erasure_marks_and_unlinks_schedule_occurrence
- id: gate.schedule.persistence_isolated
  milestone: 11
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Scheduling persistence is principal isolated.** PostgreSQL row-level security and repository predicates prevent cross-tenant and cross-principal reads and mutations."
  check: tests/integration/test_schedule_persistence_m11.py::test_schedule_rows_are_principal_isolated
- id: gate.schedule.model_create_contract
  milestone: 19
  kind: structural
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Conversational creation is a governed, default-off capability.** `schedule.create` registers only when both schedule flags are enabled and is classified as approval-gated, conditionally idempotent, non-parallel, and exactly scoped by `schedule.write`."
  check: tests/gates/test_schedule_tool_m19.py::test_schedule_create_tool_is_feature_gated_and_classified
- id: gate.schedule.model_create_happy_path
  milestone: 19
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**A direct reminder request can create one schedule through the ordinary tool pipeline.** The call waits for approval, persists one future one-time definition, pins the active agent, and delegates no tool scopes."
  check: tests/gates/test_schedule_tool_m19.py::test_schedule_create_tool_runs_through_approval_and_persists
- id: gate.schedule.model_create_authorization
  milestone: 19
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Conversational creation cannot outrun its principal.** A run without `schedule.write` is denied before execution and leaves no schedule state."
  check: tests/gates/test_schedule_tool_m19.py::test_schedule_create_tool_requires_schedule_write_scope
- id: gate.schedule.model_create_validation
  milestone: 19
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**One-time conversational input accepts only an exact future instant.** A past or non-timezone-aware at instant returns a stable argument failure and leaves no schedule state."
  check: tests/gates/test_schedule_tool_m19.py::test_schedule_create_tool_rejects_a_past_instant_without_state
- id: gate.schedule.model_create_retry
  milestone: 19
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Conversational creation is retry-safe.** Replaying one tool idempotency key and identical normalized arguments returns the original schedule rather than creating a duplicate."
  check: tests/gates/test_schedule_tool_m19.py::test_schedule_create_tool_replays_one_idempotent_schedule
- id: gate.schedule.calendar_values
  milestone: 20
  kind: property
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Calendar cadence values are closed and canonical.** Monthly selectors and yearly month/day pairs validate, normalize, and round-trip without semantic drift."
  check: tests/gates/test_schedule_calendar_m20.py::test_calendar_cadence_values_are_closed_and_canonical
- id: gate.schedule.calendar_recurrence
  milestone: 20
  kind: property
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Monthly and yearly recurrence is deterministic.** Missing numbered dates skip, month-end and leap-day intent remain explicit, and IANA fold, gap, and no-early rules hold."
  check: tests/gates/test_schedule_calendar_m20.py::test_monthly_and_yearly_recurrence_is_deterministic
- id: gate.schedule.calendar_misfire_bounded
  milestone: 20
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Calendar downtime remains bounded.** Next, latest, and count calculations cross long calendar spans without one iteration per missed occurrence."
  check: tests/gates/test_schedule_calendar_m20.py::test_calendar_downtime_lookup_and_counting_are_bounded
- id: gate.schedule.calendar_http_roundtrip
  milestone: 20
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**The HTTP control plane round-trips every calendar kind.** Existing create and update routes preserve canonical daily, weekly, monthly, and yearly definitions and exact next instants."
  check: tests/gates/test_schedule_calendar_m20.py::test_schedule_http_round_trips_every_calendar_kind
- id: gate.schedule.model_create_recurring
  milestone: 20
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Conversational recurring creation stays governed and least privilege.** Every recurring kind uses approval-gated schedule.create and persists one empty-scope revision."
  check: tests/gates/test_schedule_calendar_m20.py::test_schedule_create_supports_every_recurring_kind_through_approval
- id: gate.schedule.model_create_recurring_validation
  milestone: 20
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Conversational calendar validation and replay fail closed.** Invalid exactly-one-of and calendar inputs leave no state, identical retries replay, and changed recurrence content conflicts."
  check: tests/gates/test_schedule_calendar_m20.py::test_schedule_create_calendar_validation_and_replay_fail_closed
- id: gate.schedule.model_lifecycle_contract
  milestone: 23
  kind: structural
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Conversational lifecycle tools are feature-gated and honestly classified.** The schedule flag pair registers and advertises exactly `schedule.list`, `schedule.update`, `schedule.pause`, `schedule.resume`, and `schedule.cancel` beside creation, with the declared effects, risks, idempotency, scopes, and parallelism."
  check: tests/gates/test_schedule_lifecycle_tool_m23.py::test_schedule_lifecycle_tools_are_feature_gated_and_classified
- id: gate.schedule.model_lifecycle_discovery
  milestone: 23
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Conversational discovery is bounded and summary-only.** A principal-scoped list returns no more than fifty canonical summaries with stable IDs and revisions, paginates by opaque cursor, and exposes no instruction or authority fields."
  check: tests/gates/test_schedule_lifecycle_tool_m23.py::test_schedule_list_is_bounded_paginated_and_summary_only
- id: gate.schedule.model_pause_resume
  milestone: 23
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Conversational pause and resume use the ordinary approval pipeline.** A named schedule is discovered, paused after one approval, then resumed after one approval at its first strictly future occurrence without backfill."
  check: tests/gates/test_schedule_lifecycle_tool_m23.py::test_schedule_pause_and_resume_run_through_approval_without_backfill
- id: gate.schedule.model_cancel
  milestone: 23
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Conversational delete is terminal schedule cancellation.** An approved `schedule.cancel` stops future occurrences, preserves the record and ledger, and leaves an already materialized run unchanged."
  check: tests/gates/test_schedule_lifecycle_tool_m23.py::test_schedule_cancel_runs_through_approval_and_preserves_history
- id: gate.schedule.model_lifecycle_authorization
  milestone: 23
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Every conversational lifecycle operation has exact authority.** Listing requires only `schedule.read`, pause and resume require `schedule.write`, and cancel requires `schedule.cancel`; a missing scope is denied before execution or approval and leaves state unchanged."
  check: tests/gates/test_schedule_lifecycle_tool_m23.py::test_schedule_lifecycle_tools_require_exact_scopes_before_execution
- id: gate.schedule.model_lifecycle_validation
  milestone: 23
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Lifecycle selection and validation fail closed.** Invalid identifiers or revisions, unknown schedules, stale revisions, and illegal terminal transitions return stable failures without mutating the selected or any other schedule."
  check: tests/gates/test_schedule_lifecycle_tool_m23.py::test_schedule_lifecycle_validation_and_conflicts_fail_closed
- id: gate.schedule.model_lifecycle_retry
  milestone: 23
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Conversational lifecycle retries are state-idempotent.** Replaying an identical authorized invocation cannot duplicate a transition event or move a schedule beyond the requested legal state."
  check: tests/gates/test_schedule_lifecycle_tool_m23.py::test_schedule_lifecycle_retries_are_state_idempotent
- id: gate.schedule.model_update_contract
  milestone: 23
  kind: structural
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Conversational update is a closed, governed patch.** `schedule.update` is feature-gated, approval-gated, conditionally idempotent, non-parallel, and exactly scoped by `schedule.write`; its input accepts only identity plus content or cadence changes."
  check: tests/gates/test_schedule_update_tool_m23.py::test_schedule_update_tool_is_feature_gated_and_classified
- id: gate.schedule.model_update_happy_path
  milestone: 23
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**A conversational edit writes one future immutable revision.** Approval updates content and cadence in N+1, leaves revision N unchanged, and recomputes the first future firing."
  check: tests/gates/test_schedule_update_tool_m23.py::test_schedule_update_runs_through_approval_and_writes_one_revision
- id: gate.schedule.model_update_preserves_authority
  milestone: 23
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Conversational update cannot widen hidden execution authority.** Omitted execution fields are preserved, and updating while paused retains paused state without a next firing."
  check: tests/gates/test_schedule_update_tool_m23.py::test_schedule_update_preserves_hidden_fields_and_paused_state
- id: gate.schedule.model_update_validation
  milestone: 23
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Conversational update authorization and validation fail closed.** Missing scope, invalid content, stale identity, and terminal state write no revision or event."
  check: tests/gates/test_schedule_update_tool_m23.py::test_schedule_update_authorization_and_validation_fail_closed
- id: gate.schedule.model_update_retry
  milestone: 23
  kind: case
  spec: docs/plan/scheduling.md#hard-gates
  statement: "**Conversational update recovery applies at most once.** Identical replay returns without another revision or event, and changed content under the same key conflicts."
  check: tests/gates/test_schedule_update_tool_m23.py::test_schedule_update_recovery_applies_at_most_once
