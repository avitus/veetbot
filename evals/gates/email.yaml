# Canonical gate registry entries for Milestone 18 first-class email integration.
- id: gate.email.package_isolation
  milestone: 18
  kind: structural
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Package isolation** — `gmail_mcp` imports nothing from `agent_core` and `agent_core` imports nothing from `gmail_mcp`, walked in both directions by the architecture check."
  check: tests/gates/test_email_m18.py::test_gmail_package_is_import_isolated_from_agent_core
- id: gate.email.contract_parity
  milestone: 18
  kind: case
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Contract parity** — all three server modes pass the complete shared contract suite against the fake Gmail API and normalize to the same domain shapes."
  check: tests/gates/test_email_m18.py::test_gmail_modes_pass_the_shared_contract
- id: gate.email.roster_confinement
  milestone: 18
  kind: structural
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Roster confinement** — each mode advertises exactly its declared roster, and no mode exposes permanent deletion."
  check: tests/gates/test_email_m18.py::test_each_mode_advertises_only_its_declared_roster
- id: gate.email.classification
  milestone: 18
  kind: case
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Classification** — the registered `mcp.gmail_*` specifications carry exactly the three declared side-effect, risk, and idempotency tuples, `EXTERNAL_UNTRUSTED` output, and `ToolSource.MCP`."
  check: tests/gates/test_email_m18.py::test_registered_gmail_specs_have_exact_classification_and_trust
- id: gate.email.read_allow_write_approve
  milestone: 18
  kind: case
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Read allows, write approves** — under the default ruleset a read-server tool call is allowed and a write-server and send-server call each require approval, observing the condition's MCP arm."
  check: tests/gates/test_email_m18.py::test_default_policy_allows_reads_and_requires_write_and_send_approval
- id: gate.email.untrusted_origin
  milestone: 18
  kind: case
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Untrusted origin** — a send proposed after untrusted mail content entered the run cannot resolve to a plain allow."
  check: tests/gates/test_email_m18.py::test_untrusted_mail_can_never_plain_allow_a_send
- id: gate.email.credential_confinement
  milestone: 18
  kind: property
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Credential confinement** — over generated server configurations, the resolved credential reaches the child only as the one declared variable in a constructed environment, never argv, never inherited, never an event, result, or log."
  check: tests/gates/test_email_m18.py::test_email_credentials_cross_only_the_constructed_declared_environment
- id: gate.email.token_confinement
  milestone: 18
  kind: case
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Token confinement** — access tokens, refresh tokens, and raw upstream error text or diagnostic headers never appear in tool results or durable events; failures cross the pipe only as the closed stable codes, and normalized mailbox content is the only upstream content that crosses at all."
  check: tests/gates/test_email_m18.py::test_token_and_raw_upstream_text_never_cross_the_mcp_result
- id: gate.email.default_off
  milestone: 18
  kind: case
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Default off** — with the flag unset, no `mcp.gmail_*` server row is composed and no such tool is registered or advertised."
  check: tests/gates/test_email_m18.py::test_email_is_default_off_and_grants_nothing
- id: gate.email.scope_confinement
  milestone: 18
  kind: case
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Scope confinement** — each server requires exactly its own `mcp.{server_id}.use` scope, and a configuration declaring a platform scope for a `gmail_*` server is rejected."
  check: tests/gates/test_email_m18.py::test_email_scope_confinement_rejects_any_nonexact_scope
- id: gate.email.bootstrap_consent
  milestone: 18
  kind: case
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Bootstrap consent** — the ceremony writes owner-only credential files that round-trip through the settings loader, requests exactly the per-server Google scopes, and never prints token material."
  check: tests/gates/test_email_m18.py::test_bootstrap_consent_writes_exact_private_scope_files
- id: gate.email.failure_taxonomy
  milestone: 18
  kind: case
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Failure taxonomy** — connect-time auth failure is terminal, the mid-session ladder is bounded, rate limits and server errors are stable and retryable for the read server, but every post-dispatch failure for a write or send — including rate limits, server errors, timeouts, and lost responses — resolves `uncertain`, forbids any retry or second request, and cannot be proposed again in the run; the two package endpoints are the only hosts dialled, a redirect is refused rather than followed, and oversized upstream bodies truncate within the declared output budget."
  check: tests/gates/test_email_m18.py::test_failure_taxonomy_is_bounded_and_nonidempotent_safe
- id: gate.email.monitoring_recipe
  milestone: 18
  kind: case
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Monitoring recipe** — a daily triage schedule materializes a run whose reads pass without approval, whose first write parks an approval whose notification is content-free, and whose outcome is reported."
  check: tests/gates/test_email_m18.py::test_daily_triage_recipe_reads_then_parks_write_and_reports_outcome
- id: gate.email.named_account_composition
  milestone: 18
  kind: case
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Named-account composition** — a two-account manifest synthesizes three servers per account; the default retains the legacy ids, the second uses account-qualified ids, and all six advertise the expected rosters and exact server-id scopes."
  check: tests/gates/test_email_m18.py::test_named_accounts_compose_isolated_server_triplets
- id: gate.email.account_credential_isolation
  milestone: 18
  kind: property
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Account credential isolation** — every generated account and mode server resolves one distinct credential reference and passes only that credential plus the non-secret account id to its child; no process can receive another account's credential."
  check: tests/gates/test_email_m18.py::test_named_account_credentials_cross_only_their_server_environment
- id: gate.email.account_bound_bootstrap
  milestone: 18
  kind: case
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Account-bound bootstrap** — bootstrap with `--account-id` writes three owner-only documents tagged with that id, a matching server accepts them, and a missing or different id is rejected before any Gmail request; legacy untagged documents remain valid only through legacy single-account configuration."
  check: tests/gates/test_email_m18.py::test_account_bound_bootstrap_tags_and_validates_credentials
- id: gate.email.multi_account_configuration_bounds
  milestone: 18
  kind: case
  spec: docs/plan/email-integration.md#hard-gates
  statement: "**Multi-account configuration bounds** — the accounts manifest is versioned, closed, bounded at eight unique ids, requires its declared default and three absolute private credential paths per account, and is mutually exclusive with the legacy triplet; every violation fails at startup."
  check: tests/gates/test_email_m18.py::test_multi_account_manifest_rejects_every_invalid_boundary

# Milestone 26: client modes and adaptive email experience.
- id: gate.email.experience_shared_mode_state
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Shared mode state** — Chat and Email preserve the same principal, agent, persona, memories, active Chat run, composer and selections across switching and thread handoff."
  check: tests/native/test_email_m26.py::test_email_shared_mode_state
- id: gate.email.experience_native_layouts
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Native layouts** — iPhone, compact and regular iPad, and Mac expose accessible adaptive navigation and editing while retaining supported operating-system floors."
  check: tests/native/test_email_m26.py::test_email_native_layouts
- id: gate.email.experience_scope_and_flag
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Scope and feature confinement** — Email application routes and capabilities require the email experience feature flag, exact email.read or email.write scope, and current account-specific authority; disabled composition exposes no email application routes."
  check: tests/gates/test_email_experience_m26.py::test_email_api_is_flag_gated_scope_checked_and_private
- id: gate.email.experience_account_identity
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Stable account identity** — Verified principal-scoped mailbox identity survives default-account changes; reconnecting another Google identity cannot reinterpret old evidence or dispatch with another account credential."
  check: tests/gates/test_email_experience_m26.py::test_account_capability_rebinding_preserves_old_evidence_and_new_operations
- id: gate.email.experience_foreground_admission
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Foreground admission** — Entry, foreground return and sixty-second visible refresh admit bounded coalesced work; hidden or background clients admit no new slices and repeated multi-device requests cannot create an unbounded backlog."
  check: tests/native/test_email_m26.py::test_email_foreground_admission
- id: gate.email.experience_sync_contract
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Synchronization contract** — The first-party MCP contract returns bounded versioned account-qualified identities, history changes, labels, direction, dates, reply headers and completeness with shared fake-provider contract coverage."
  check: tests/gates/test_email_m26_gmail.py::test_m26_thread_pages_are_complete_and_carry_reply_provenance
- id: gate.email.experience_sync_recovery
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Synchronization recovery** — Projection updates and cursors commit consistently; duplicate or reordered observations, pagination, cursor expiry, deletions, revocation and partial account failure preserve accurate recoverable source state."
  check: tests/gates/test_email_runtime_m26.py::test_deleted_last_message_updates_projection_before_history_cursor_advances
- id: gate.email.experience_history_progress
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Historical progress** — Active bounded slices resume through recent and arbitrarily old eligible history without starvation, duplicate evidence or claiming metadata-only coverage as semantic understanding."
  check: tests/gates/test_email_runtime_m26.py::test_rolling_history_waits_for_analysis_then_reaches_later_source_windows
- id: gate.email.experience_governed_tasks
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Governed task execution** — Typed deterministic ingestion uses ordinary durable worker leases, checkpoints, cancellation, policy and budgets without direct API-handler Gmail calls, fabricated owner messages or model-selected pagination."
  check: tests/gates/test_email_runtime_m26.py::test_refresh_uses_governed_mailbox_reads_without_owner_prompt_or_model
- id: gate.email.experience_aggregate_cost
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Aggregate automatic-email cost** — Atomic reservations and actual usage cover all automatic email stages across accounts and devices, enforce USD 20 per UTC day and USD 200 per rolling thirty days with lower limits prevailing, and release or reconcile reservations on every terminal path."
  check: tests/gates/test_email_experience_m26.py::test_aggregate_email_ceilings_cover_accounts_and_unresolved_reservations
- id: gate.email.experience_feedback_scope
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Feedback scope** — Thread, person, topic and reply-need feedback have distinct authenticated effects; explicit owner corrections dominate inferred evidence across Email and Chat."
  check: tests/gates/test_email_chat_m26.py::test_chat_feedback_requires_current_owner_source_and_replays_shared_rule
- id: gate.email.experience_feedback_replay
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Feedback replay and undo** — Idempotent feedback, undo, correction and reset rebuild derived influence from surviving evidence without replaying removed influence or learning negative preference from mere viewing or dismissal."
  check: tests/gates/test_email_experience_m26.py::test_priority_selection_feedback_scope_and_undo
- id: gate.email.experience_assessment_invalidation
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Assessment invalidation** — Source and relevant profile or extractor revisions invalidate affected assessments; unchanged current polls spend no classification work while unfinished historical work remains resumable."
  check: tests/gates/test_email_runtime_m26.py::test_changed_mail_is_assessed_and_drafted_once_through_metered_model
- id: gate.email.experience_priority_quality
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Priority quality** — Frozen chronological holdouts satisfy the approved precision, coverage and personalization gates, per-account floors, no future-evidence leakage and reported uncertainty against declared baselines."
  check: tests/gates/pending.py::pending_gate
- id: gate.email.experience_relationship_evidence
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Relationship evidence** — Correspondent and organization linkage requires supported identity and relationship evidence; role or domain alone cannot establish portfolio membership, ownership or personal importance."
  check: tests/gates/test_email_learning_m26.py::test_relationship_context_respects_provider_sensitivity_and_deal_recency
- id: gate.email.experience_style_lineage
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Style lineage** — Historical SENT examples exclude quoted, forwarded, automated and ambiguous-author material as specified; user edits dominate, generated-draft lineage prevents self-training, and learned style never edits trusted persona."
  check: tests/gates/test_email_learning_m26.py::test_generated_sent_lineage_survives_mime_whitespace_and_body_expiry
- id: gate.email.experience_style_quality
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Style quality** — The private paired evaluation satisfies the approved style preference and rewrite thresholds with separately blocking factual and recipient faithfulness checks."
  check: tests/gates/pending.py::pending_gate
- id: gate.email.experience_draft_relevance
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Draft relevance** — At most three relevant automatic reply proposals are prepared, with approved reply-need quality and abstention for answered threads, missing decisions, essential unread attachments and unsupported commitments."
  check: tests/gates/pending.py::pending_gate
- id: gate.email.experience_draft_revisions
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Draft revisions** — Server-owned internal drafts preserve owner edits and immutable history, avoid duplicates, use optimistic concurrency and retain both conflicting device edits without a Gmail write."
  check: tests/gates/test_email_experience_m26.py::test_draft_edits_preserve_revisions_and_reject_stale_writes
- id: gate.email.experience_send_approval
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Exact send approval** — Every send requires approval of the exact mailbox, recipients, subject and body; edited content or observed source changes invalidate prior approval, and no direct send API bypass exists."
  check: tests/gates/test_email_runtime_m26.py::test_send_freezes_exact_value_and_rechecks_source_after_approval
- id: gate.email.experience_send_claim
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Atomic send claim** — A fresh bounded thread read precedes a serialized local frozen-action claim; concurrent edit or double-send cannot reuse stale approval, while the unavoidable external post-read race is stated honestly."
  check: tests/gates/test_email_runtime_m26.py::test_external_reply_after_approval_invalidates_send_without_dispatch
- id: gate.email.experience_send_uncertainty
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Send uncertainty** — Confirmed sends persist outcome; pre-dispatch failures follow governed retry, but any possibly dispatched non-idempotent send becomes uncertain and never automatically resends after crash or lost response."
  check: tests/gates/test_email_runtime_m26.py::test_recovery_after_send_dispatch_preserves_uncertainty_before_any_fresh_read
- id: gate.email.experience_reply_headers
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Reply headers and recipients** — Reply and reply-all use verified sender identities, correct Reply-To and owner exclusion, matching subject/thread and RFC reply headers without trusting message-body recipient instructions."
  check: tests/gates/test_email_m26_gmail.py::test_m26_outbound_reply_headers_are_encoded_by_value
- id: gate.email.experience_semantic_grounding
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Semantic memory grounding** — A separately versioned evaluated email extractor yields exact source-span-grounded useful facts with account, message, author and event provenance and the approved precision and recall floors."
  check: tests/gates/pending.py::pending_gate
- id: gate.email.experience_semantic_authority
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Semantic memory authority** — Correspondent and historical SENT evidence stay attributed, inferred and sensitivity-governed, cannot overwrite owner assertions, and leave existing evaluated extraction policies unchanged."
  check: tests/unit/test_email_semantics_m26.py::test_semantic_formation_preserves_attribution_historical_dates_and_shared_scope
- id: gate.email.experience_semantic_lifecycle
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Semantic memory lifecycle** — Historical source age and freshness govern current beliefs; import, repeated reads and self-citation cannot renew stale claims, and deliberate historical recall remains dated."
  check: tests/unit/test_email_semantics_m26.py::test_historical_fact_is_absent_from_current_recall_but_visible_as_of_source_date
- id: gate.email.experience_shared_recall
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Shared recall** — Eligible new-policy contextual email memories and profiles are relevantly usable across the same owner's accounts and Chat without broadening tenant, principal, sensitivity or credential authority or the old adapter's LOCAL contract."
  check: tests/gates/test_email_chat_m26.py::test_chat_context_uses_shared_owner_style_with_independent_source_binding
- id: gate.email.experience_source_erasure
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Source erasure** — Scoped authenticated exclusion and erasure remove source copies and derived influence across projections, examples, events, checkpoints, profiles and memory with replay suppression while preserving independently supported owner evidence."
  check: tests/contract/test_email_source_erasure_contract.py::test_memory_source_erasure_contract
- id: gate.email.experience_retention
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Retention** — The thirty-day body-cache and sent/discarded-draft windows, five-hundred bounded style excerpts, until-deletion audit copies and backup expiry are enforced without misrepresenting cache expiry as universal deletion."
  check: tests/gates/test_email_experience_m26.py::test_maintenance_expires_body_cache_and_sent_drafts_but_keeps_unsent_edits
- id: gate.email.experience_privacy
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Privacy and trust** — Adversarial mail cannot confer action authority, alter persona or leak foreign-principal data or secrets; raw personal content stays out of logs, notifications and public or checked-in evaluation material."
  check: tests/gates/test_email_privacy_m26.py::test_email_privacy_boundaries
- id: gate.email.experience_api_boundaries
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Application API boundaries** — Every new public command has happy-path, validation, authorization, conflict, failure and retry coverage with scoped repositories, PostgreSQL RLS, migration parity and current account authority."
  check: tests/gates/test_email_api_boundaries_m26.py::test_email_application_http_boundaries
- id: gate.email.experience_release_evidence
  milestone: 26
  kind: case
  spec: docs/plan/email-experience.md#hard-gates
  statement: "**Integrated release evidence** — All functional and quality gates, native platform lanes, cost/performance calibration and authorized two-account mailbox smoke pass; final-head hosted review and merged-revision production evidence remain required before milestone completion."
  check: tests/gates/pending.py::pending_gate
# Canonical gate registry entries for Milestone 30 email unsubscribe assistance.
- id: gate.email.unsubscribe_read_contract
  milestone: 30
  kind: case
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**The read contract is closed and Google-only** — The read server exposes the bounded `bulk` block on thread summaries and the versioned application-only `get_unsubscribe` block, passes the shared contract suite against the fake provider, never advertises `get_unsubscribe` to a model, and still dials only its two fixed endpoints."
  check: tests/gates/test_email_unsubscribe_gmail_m30.py::test_unsubscribe_read_contract_is_closed_and_google_only
- id: gate.email.unsubscribe_eligibility
  milestone: 30
  kind: property
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**Eligibility is deterministic and authenticated** — Over generated header sets, `one_click` is offered only for an HTTPS address, the exact `List-Unsubscribe=One-Click` marker, and a Gmail-verified passing DKIM signature covering both headers; `mailto` only with covered `List-Unsubscribe` and the closed single-recipient fields; a forged lower verdict header, a missing clause, or any extra `mailto` field yields `none`."
  check: tests/gates/test_email_unsubscribe_gmail_m30.py::test_unsubscribe_eligibility_is_deterministic_and_authenticated
- id: gate.email.unsubscribe_server_derived_destination
  milestone: 30
  kind: structural
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**The destination is server-derived** — `email.unsubscribe` accepts only subscription ids and evidence digests under a closed schema; the dialled address equals the stored verified value; a digest mismatch, a foreign subscription, or an address failing the public-HTTPS rule refuses that target before any network activity; and tool registration rejects any other tool claiming the `unsubscribe_endpoint` target."
  check: tests/gates/test_email_unsubscribe_m30.py::test_unsubscribe_destination_is_server_derived
- id: gate.email.unsubscribe_fixed_request
  milestone: 30
  kind: case
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**The request is fixed** — Every request is a `POST` of exactly `List-Unsubscribe=One-Click` with the form content type and the fixed user agent, carries no cookie, authorization, referrer, or origin, never follows a redirect, verifies TLS without override, reads at most 64 KiB and keeps only the status class, and meets its ten-second deadline."
  check: tests/gates/test_email_unsubscribe_transport_m30.py::test_unsubscribe_request_is_fixed
- id: gate.email.unsubscribe_public_https_egress
  milestone: 30
  kind: case
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**Egress is public HTTPS only** — Every dial crosses the process-local proxy under the public-HTTPS rule: private, loopback, link-local, metadata, carrier-grade NAT, unique-local, and IPv4-mapped destinations, IP literals, non-443 ports, and plaintext are refused before dialing; a name resolving to any non-public address is refused whole; the checked address is the one dialled; and the operator allowlist, the sandbox proxy, and the browser transport are unchanged and cannot select this transport."
  check: tests/gates/test_email_unsubscribe_transport_m30.py::test_unsubscribe_egress_is_public_https_only
- id: gate.email.unsubscribe_approval_floor
  milestone: 30
  kind: case
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**The approval floor holds** — `email.unsubscribe` resolves to `REQUIRE_APPROVAL` under the default ruleset and under every profile, the `mailto` send and both label actions keep their Milestone 18 floors, and no standing authorization satisfies any of them."
  check: tests/gates/test_email_unsubscribe_m30.py::test_unsubscribe_approval_floor_holds
- id: gate.email.unsubscribe_gesture_consent
  milestone: 30
  kind: case
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**Gesture consent is exact** — A consent is immutable, expires after 120 seconds, and resolves a pending approval only when tool, normalized arguments, owner, authority, revisions, and expiry all match, after `approval.requested` is recorded and again at the pre-effect boundary; any mismatch, expiry, or revocation produces no network request and no mailbox write; and refresh, model work, and mail content cannot create a consent."
  check: tests/gates/test_email_unsubscribe_m30.py::test_unsubscribe_gesture_consent_is_exact
- id: gate.email.unsubscribe_batch_approval
  milestone: 30
  kind: case
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**Chat approval is by value** — One invocation carries one to twenty-five unique targets; its approval view names each sender, address, account, mechanism, and destination host and never the path or query; withheld values stay verifiable by digest; and changed arguments or evidence void the approval."
  check: tests/gates/test_email_unsubscribe_m30.py::test_unsubscribe_batch_approval_is_by_value
- id: gate.email.unsubscribe_idempotent_recovery
  milestone: 30
  kind: case
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**Recovery is idempotent** — A lost response, a timeout, or a crash after the effect watermark re-executes the same fixed request, never dials an already accepted target again, persists each target's outcome once, and replays an identical command's durable result."
  check: tests/gates/test_email_unsubscribe_m30.py::test_unsubscribe_recovery_is_idempotent
- id: gate.email.unsubscribe_mailto_closed
  milestone: 30
  kind: case
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**The `mailto` path is closed** — The message is exactly the verified single recipient, subject, and body within their bounds, dispatched by value through the originating account's send server; an outcome lost after dispatch is `uncertain` and is never sent again automatically."
  check: tests/gates/test_email_unsubscribe_m30.py::test_unsubscribe_mailto_path_is_closed
- id: gate.email.unsubscribe_label_actions
  milestone: 30
  kind: case
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**Label actions are fixed deltas over server-selected threads** — Report spam adds `SPAM` and removes `INBOX`, Not spam restores exactly the recorded threads, and cleanup removes `INBOX`; thread sets come only from the run's own governed search, post-filtered by identity, at most 25 per call and 100 per gesture; callers supply neither threads nor labels; and a crafted identity cannot widen the set."
  check: tests/gates/test_email_unsubscribe_m30.py::test_unsubscribe_label_actions_are_fixed_deltas
- id: gate.email.unsubscribe_census_projection
  milestone: 30
  kind: property
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**The census is a deterministic projection** — Over generated duplicate, reordered, and resynchronized observations the same records result; identity is the account-qualified list identifier or sender address; volume counts distinct threads inside the ninety-day window; Spam, Trash, and owner-sent mail never form a record; and the census makes no model call, reserves no automatic-email dollars, and issues no query of its own."
  check: tests/gates/test_email_unsubscribe_m30.py::test_unsubscribe_census_is_a_deterministic_projection
- id: gate.email.unsubscribe_durable_decisions
  milestone: 30
  kind: case
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**Owner decisions are durable** — Keep, an accepted unsubscribe, and a spam report survive new mail, re-import, and resynchronization without re-suggestion; reversing Keep restores the row; and protected senders sort last, are skipped by Select all, and remain individually actionable."
  check: tests/gates/test_email_unsubscribe_m30.py::test_unsubscribe_owner_decisions_are_durable
- id: gate.email.unsubscribe_outcome_honesty
  milestone: 30
  kind: case
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**Outcomes and follow-up are honest** — Only a 2xx response records `unsubscribed`; every other observation records `failed` with a closed content-free code; mail dated after the grace period marks `still_sending` and mail inside it changes nothing; and the follow-up dispatches nothing."
  check: tests/gates/test_email_unsubscribe_m30.py::test_unsubscribe_outcomes_and_follow_up_are_honest
- id: gate.email.unsubscribe_routes_scope_and_flag
  milestone: 30
  kind: structural
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**Routes are flagged, scoped, and bounded** — The four routes are absent without the flag; each requires its exact email scope and current account authority for what its mechanism calls; every command has validation, authorization, conflict, failure, and retry coverage; and responses are private, never include the address, and hide foreign subscriptions as 404."
  check: tests/gates/test_email_unsubscribe_m30.py::test_unsubscribe_routes_are_flagged_scoped_and_bounded
- id: gate.email.unsubscribe_chat_tools
  milestone: 30
  kind: case
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**The Chat tools are confined** — `email.subscriptions` is read-only with `EXTERNAL_UNTRUSTED` output and never returns the address; `email.unsubscribe` registers with exactly its declared tuple; and with the flag unset neither tool is registered or advertised."
  check: tests/gates/test_email_unsubscribe_m30.py::test_unsubscribe_chat_tools_are_confined
- id: gate.email.unsubscribe_privacy
  milestone: 30
  kind: case
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**Privacy holds under adversarial mail** — The address and its token reach no model context, approval view, response, notification, log, or metric; sender identity reaches no log, metric, or notification; body instructions and forged headers can neither trigger nor redirect a request; and source exclusion and principal erasure remove evidence, tool-event copies, and every record this milestone adds."
  check: tests/gates/test_email_unsubscribe_m30.py::test_unsubscribe_privacy_holds_under_adversarial_mail
- id: gate.email.unsubscribe_persistence_parity
  milestone: 30
  kind: case
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**Persistence agrees on both adapters** — Subscription, consent, and operation records pass one contract suite on the in-memory and PostgreSQL stores with tenant and principal predicates and forced row-level security, and identical identities in different accounts never collide."
  check: tests/gates/test_email_unsubscribe_m30.py::test_unsubscribe_persistence_agrees_across_accounts
- id: gate.email.unsubscribe_native_experience
  milestone: 30
  kind: case
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**The native experience is complete and honest** — iPhone, compact and regular iPad, and Mac present the Subscriptions view, the thread action, and the confirmation naming each mechanism; rows settle from the durable operation and restore with an actionable error; selection stops at twenty-five and skips protected rows; and a server or account without support shows nothing in its place."
  check: tests/native/test_email_unsubscribe_m30.py::test_unsubscribe_native_experience
- id: gate.email.unsubscribe_release_evidence
  milestone: 30
  kind: case
  spec: docs/plan/email-unsubscribe.md#hard-gates
  statement: "**Integrated release evidence** — Every gate above, the local, PostgreSQL, and native lanes, and an owner-authorized real-mailbox smoke on both accounts — one accepted one-click request, one `mailto` unsubscribe, one spam report reversed by Not spam, and one cleanup — pass, with final-head hosted review and merged-revision production evidence."
  check: tests/gates/pending.py::pending_gate
