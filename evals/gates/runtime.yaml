# Canonical gate registry entries for the runtime area.
- id: gate.runtime.one_terminal_writer
  milestone: 1
  kind: structural
  spec: docs/plan/runtime-loop.md#hard-gates
  statement: "**One terminal writer.** A structural gate asserts that `RunRepository.transition` and `RunQueue.release` are called from exactly one module, `runtime/executor.py`. A second call site anywhere under `agent_core` fails the build. This is the gate that keeps the suspension fix from eroding."
  check: tests/gates/pending.py::pending_gate
- id: gate.runtime.no_ambient_time
  milestone: 1
  kind: structural
  spec: docs/plan/runtime-loop.md#hard-gates
  statement: "**No ambient time.** No module under `agent_core` outside the clock adapter references `datetime.now`, `datetime.utcnow`, `time.time`, or `time.monotonic`."
  check: tests/gates/pending.py::pending_gate
- id: gate.runtime.no_ambient_id
  milestone: 1
  kind: structural
  spec: docs/plan/runtime-loop.md#hard-gates
  statement: "**No ambient identity.** No module under `agent_core` outside the id adapter calls `uuid.uuid4` or `uuid.uuid1`."
  check: tests/gates/pending.py::pending_gate
- id: gate.runtime.step_identity
  milestone: 1
  kind: case
  spec: docs/plan/runtime-loop.md#hard-gates
  statement: "**Every step has a persisted identity.** For every run in the suite, `runs.step_count` equals the count of distinct `step_number` values in `model_calls` for that run."
  check: tests/gates/pending.py::pending_gate
- id: gate.runtime.budget_stops
  milestone: 1
  kind: case
  spec: docs/plan/runtime-loop.md#hard-gates
  statement: "**The budget stops the loop.** A run whose `max_steps` is reached fails with `FailureReason.MAX_STEPS_EXCEEDED` and is never requeued; a run whose cost limit is reached mid-retry fails at the attempt check rather than after the attempt."
  check: tests/gates/pending.py::pending_gate
- id: gate.runtime.lease_once
  milestone: 2
  kind: case
  spec: docs/plan/runtime-loop.md#hard-gates
  statement: "**The lease is released exactly once.** In every case in the suite, including the crash and fence cases, the count of `release` calls per run execution is at most one, and a suspended run's lease is released before its `run.waiting_*` event is visible to a second worker."
  check: tests/gates/pending.py::pending_gate
- id: gate.runtime.fenced_no_write
  milestone: 2
  kind: case
  spec: docs/plan/runtime-loop.md#hard-gates
  statement: "**Fenced workers do not write.** In the `kill_worker` intervention cases, after a fence the fenced worker performs zero row-affecting writes other than the single `run.fenced` append."
  check: tests/gates/pending.py::pending_gate
- id: gate.runtime.resume_idempotent
  milestone: 2
  kind: case
  spec: docs/plan/runtime-loop.md#hard-gates
  statement: "**Resume is idempotent on the pipeline boundary.** Resuming a run whose checkpoint carries `pending_tool_calls` re-enters the pipeline at step 6 and produces no duplicate `tool.call.proposed` event and no second effect for any call whose watermark was already set."
  check: tests/gates/pending.py::pending_gate
- id: gate.runtime.waiting_holds_nothing
  milestone: 4
  kind: case
  spec: docs/plan/runtime-loop.md#hard-gates
  statement: "**A waiting run holds nothing.** While a run is in either `WAITING_*` state, it holds no lease, no worker slot, and no open transaction, and the lease sweep does not reclaim it."
  check: tests/gates/pending.py::pending_gate
- id: gate.runtime.cancel_keeps_effects
  milestone: 5
  kind: case
  spec: docs/plan/runtime-loop.md#hard-gates
  statement: "**Cancellation never abandons an effect.** No case produces a run in `CANCELLED` with a `tool_invocations` row whose `effect_sent_at` is set and whose status is `cancelled`."
  check: tests/gates/pending.py::pending_gate
- id: gate.runtime.build_fits
  milestone: 7
  kind: property
  spec: docs/plan/runtime-loop.md#hard-gates
  statement: "**`build()` is called with a checkpoint that fits.** Every `context.build` span is preceded in its step by a pressure measurement, and no `model.request.started` carries a request over the plan's budget."
  check: tests/gates/pending.py::pending_gate
- id: gate.runtime.build_stable
  milestone: 7
  kind: property
  spec: docs/plan/runtime-loop.md#hard-gates
  statement: "**Two builds of one checkpoint are byte-identical.** The step-retry path rebuilds from the same checkpoint and produces the same `prefix_sha256`."
  check: tests/gates/pending.py::pending_gate
