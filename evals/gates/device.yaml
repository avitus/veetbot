# Canonical gate registry entries for Milestone 12 device identity.
- id: gate.device.register_idempotent
  milestone: 12
  kind: case
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**Device registration is idempotent and principal-scoped.** Re-registering the same client device identity for the same principal updates one row in place; the same identity under another principal is a distinct row; a cross-principal read returns not found."
  check: tests/integration/test_notification_persistence_m12.py::test_postgres_device_registration_is_idempotent_and_principal_scoped
- id: gate.device.token_unique
  milestone: 12
  kind: case
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**One live token belongs to one active device.** A token re-registered from a new installation moves to the new row and the old row's token is nulled; two active devices never hold the same token."
  check: tests/integration/test_notification_persistence_m12.py::test_postgres_live_push_token_moves_to_new_installation
- id: gate.device.revoke_immediate
  milestone: 12
  kind: case
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**Revocation takes effect before the next claim.** Revoking a device clears its token, appends device.revoked, and a row claimed by the next dispatch targets no revoked device."
  check: tests/gates/test_notification_api_m12.py::test_device_routes_cover_lifecycle_audit_scopes_and_test_enqueue
- id: gate.device.lifecycle_audited
  milestone: 12
  kind: case
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**Device lifecycle is audited once and content-free.** Register, token update, revoke, invalidation, and delete each append exactly one process event with a stable derivation key and a token fingerprint, never the token."
  check: tests/gates/test_notification_api_m12.py::test_device_routes_cover_lifecycle_audit_scopes_and_test_enqueue
- id: gate.device.persistence_schema
  milestone: 12
  kind: structural
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**The device and notification schema encodes its trust boundaries.** Metadata inspection proves keys, the partial unique token index, the provider-specific push-field constraints, the dispatch and listing indexes, and row-level security on all three tables."
  check: tests/unit/test_persistence_schema.py::test_notification_tables_encode_routing_identity_and_query_constraints
- id: gate.device.persistence_isolated
  milestone: 12
  kind: case
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**Device and notification persistence is principal isolated.** Row-level security and repository predicates prevent cross-tenant and cross-principal reads and mutations of devices, outbox rows, and deliveries."
  check: tests/integration/test_notification_persistence_m12.py::test_notification_rows_are_principal_isolated_and_rls_forced
- id: gate.device.capability_registration
  milestone: 23
  kind: structural
  spec: docs/plan/device-channel-and-sms.md#hard-gates
  statement: "**Capability-derived registration.** A device tool is registered with ToolSource.DEVICE exactly while a registered, unrevoked device declares its capability; revocation or deletion removes it."
  check: tests/gates/test_device_channel_m23.py::test_gate_capability_registration
- id: gate.device.invocation_idempotent
  milestone: 23
  kind: case
  spec: docs/plan/device-channel-and-sms.md#hard-gates
  statement: "**Invocation idempotency.** Replaying an invocation id creates one device_invocations row and at most one push."
  check: tests/gates/test_device_channel_m23.py::test_gate_invocation_idempotent
- id: gate.device.foreign_device_denied
  milestone: 23
  kind: case
  spec: docs/plan/device-channel-and-sms.md#hard-gates
  statement: "**Foreign device denied.** A device other than the invocation's target — or a revoked target — can neither fetch nor answer it."
  check: tests/gates/test_device_channel_m23.py::test_gate_foreign_device_denied
- id: gate.device.no_send_without_result
  milestone: 23
  kind: property
  spec: docs/plan/device-channel-and-sms.md#hard-gates
  statement: "**No send without a device result.** No server code path moves an invocation to sent; only a device-posted result does."
  check: tests/gates/test_device_channel_m23.py::test_gate_no_send_without_result
- id: gate.device.offline_outcome
  milestone: 23
  kind: case
  spec: docs/plan/device-channel-and-sms.md#hard-gates
  statement: "**Offline outcome.** An invocation unanswered at invocation_timeout resolves expired and surfaces tool.device_offline."
  check: tests/gates/test_device_channel_m23.py::test_gate_offline_outcome
- id: gate.device.untrusted_output
  milestone: 23
  kind: structural
  spec: docs/plan/device-channel-and-sms.md#hard-gates
  statement: "**Untrusted device output.** Every device tool result carries EXTERNAL_UNTRUSTED, forced at registration."
  check: tests/gates/test_device_channel_m23.py::test_gate_untrusted_output
- id: gate.device.presence_revalidated
  milestone: 23
  kind: case
  spec: docs/plan/device-channel-and-sms.md#hard-gates
  statement: "**Presence revalidated.** Every device-channel action revalidates presence and granted scopes; a revoked device fails on its next action."
  check: tests/gates/test_device_channel_m23.py::test_gate_presence_revalidated
- id: gate.device.outbound_secret_scan
  milestone: 23
  kind: case
  spec: docs/plan/device-channel-and-sms.md#hard-gates
  statement: "**Outbound secret scan.** A device.sms.send body matching a hardline secret pattern is refused before any invocation row is written."
  check: tests/gates/test_device_channel_m23.py::test_gate_outbound_secret_scan
- id: gate.device.ingest_idempotent
  milestone: 23
  kind: case
  spec: docs/plan/device-channel-and-sms.md#hard-gates
  statement: "**Ingest idempotency.** A replayed (sender, body, received_at) digest stores one receipt and seeds one run."
  check: tests/gates/test_device_channel_m23.py::test_gate_ingest_idempotent
- id: gate.device.untrusted_triage_routing
  milestone: 23
  kind: case
  spec: docs/plan/device-channel-and-sms.md#hard-gates
  statement: "**Untrusted triage routing.** An ingested message enters the standing triage session as device-originated untrusted content and cannot resolve a consequential action to a plain allow."
  check: tests/gates/test_device_channel_m23.py::test_gate_untrusted_triage_routing
- id: gate.device.no_body_in_logs
  milestone: 23
  kind: case
  spec: docs/plan/device-channel-and-sms.md#hard-gates
  statement: "**No body in logs.** Message bodies appear in no process log line and no event besides the designated content event."
  check: tests/gates/test_device_channel_m23.py::test_gate_no_body_in_logs
- id: gate.device.default_off
  milestone: 23
  kind: case
  spec: docs/plan/device-channel-and-sms.md#hard-gates
  statement: "**Default off.** With either flag unset, no device-channel route mounts, no capability-derived tool registers, and no invocation push is sent."
  check: tests/gates/test_device_channel_m23.py::test_gate_default_off
