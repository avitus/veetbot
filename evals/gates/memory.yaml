# Canonical gate registry entries for the memory area.
- id: gate.memory.contradiction
  milestone: 9
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Contradiction handling** — inject a preference change; verify supersession (not duplication) and that retrieval returns the current belief."
  check: tests/gates/test_memory_m9.py::test_contradiction
- id: gate.memory.no_fabrication
  milestone: 9
  kind: corpus
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**No fabrication** — it must not form beliefs unsupported by episodes."
  check: tests/gates/test_memory_m9.py::test_no_fabrication
  corpus: evals/corpora/memory_no_fabrication/
  minimum_members: 3
- id: gate.memory.form_injection
  milestone: 9
  kind: corpus
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Injection resistance** — an untrusted \"remember X\" must not form a belief."
  check: tests/gates/test_memory_m9.py::test_form_injection
  corpus: evals/corpora/memory_form_injection/
  minimum_members: 3
- id: gate.memory.correction_durable
  milestone: 9
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Correction durability** — a rejected belief must not return, including after a full re-derivation under a newer consolidation policy. A hard gate."
  check: tests/gates/test_memory_m9.py::test_correction_durable
- id: gate.memory.no_policy_regress
  milestone: 9
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**No policy regression** — adapt LOCOMO-style long-horizon scenarios to exercise the write path. Gate: memory improves target eval cases **without** increasing policy failures."
  check: tests/gates/test_harness_m9.py::test_memory_changes_outcome
- id: gate.memory.multi_candidate
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Multiple ordinary memories** — one ordinary user utterance naming two durable entities forms two separate, provenance-linked beliefs, and an independent preference in the same utterance remains a third belief."
  check: tests/gates/test_memory_m10.py::test_ordinary_conversation_forms_one_memory_per_durable_entity
- id: gate.memory.source_integrity
  milestone: 10
  kind: property
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Automatic-source integrity** — automatic candidates name only source events authored by the owning principal; model, tool, and foreign-principal content cannot become a direct source."
  check: tests/gates/test_memory_m10.py::test_automatic_formation_uses_only_the_owning_principal_user_events
- id: gate.memory.idle_lifecycle
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Idle lifecycle** — a terminal run enqueues one idempotent formation flag, returns without extracting, and maintenance consolidates the session only once both the session-idle boundary and the flag's persisted `not_before` have elapsed."
  check: tests/gates/test_memory_m10.py::test_terminal_run_is_flagged_then_consolidated_after_idle
- id: gate.memory.formation_bounded
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Bounded automatic formation** — a pathological utterance cannot commit more than twelve candidates in one consolidation, a secret-shaped candidate is still rejected, and the consolidation audit accounts for extractor overproduction rather than silently truncating it."
  check: tests/gates/test_memory_m10.py::test_automatic_formation_caps_candidates_and_rejects_secrets
- id: gate.memory.correction_isolated
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Ordinary correction isolation** — a natural-language retraction supersedes the matching entity while unrelated entities and preference topics continue to coexist."
  check: tests/gates/test_memory_m10.py::test_ordinary_retraction_supersedes_the_owned_entity_memory
- id: gate.memory.inspection_governed
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Governed inspection and reversibility** — the public memory surface exposes beliefs, formation audits, and recall traces through the same principal-scoped service used for edits and deletion; a foreign principal can observe or mutate none of them."
  check: tests/gates/test_memory_m10.py::test_memory_inspection_surface_is_governed_and_traceable
- id: gate.memory.extractor_contract
  milestone: 10
  kind: structural
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Extractor contract coverage** — every shipped MemoryCandidateExtractor implementation is registered against the shared contract for separate, scope-correct, provenance-bound proposals."
  check: tests/contract/test_memory_candidate_extractor_contract.py::test_extractor_returns_separate_provenance_bound_candidate_proposals
- id: gate.memory.provider_activation_bound
  milestone: 10
  kind: property
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Evidence-bound activation** — provider assistance is eligible only on an exact extractor, formation-policy, model-policy, provider, model, policy-profile, and compiled-policy tuple match."
  check: tests/gates/test_memory_m10.py::test_provider_activation_requires_an_exact_evaluation_tuple
- id: gate.memory.provider_boundary
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Provider safety boundary** — invented source ids and secret-shaped provider proposals cannot pass the governed service's provenance and eligibility checks."
  check: tests/unit/test_memory_provider_extraction.py::test_provider_proposals_still_pass_source_and_secret_gates
- id: gate.memory.provider_audit_fallback
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Audited deterministic fallback** — a failed provider attempt records a content-free failure audit and returns independently derived deterministic proposals."
  check: tests/unit/test_memory_provider_extraction.py::test_provider_failure_is_audited_and_uses_deterministic_fallback
- id: gate.memory.provider_evidence_publish
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Evidence publication** — the checked-in paired evaluation publishes an exact activation tuple and corpus hash only after lift, fabrication, and policy-regression gates pass, while failures leave no artifact."
  check: tests/unit/test_memory_formation_eval.py::TestProviderEvidencePublicationGate::test_pass_publishes_the_exact_tuple
- id: gate.memory.currency
  milestone: 9
  kind: case
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**Currency** — after a preference change, retrieval must return the new belief and never the superseded one."
  check: tests/gates/test_memory_m9.py::test_currency
- id: gate.memory.historical_correct
  milestone: 9
  kind: case
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**Historical correctness** — an `as_of` query returns what was believed then."
  check: tests/gates/test_memory_m9.py::test_historical_correct
- id: gate.memory.recall_injection
  milestone: 9
  kind: corpus
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**Injection resistance** — a poisoned belief renders `[BLOCKED]` and does not alter behavior."
  check: tests/gates/test_memory_m9.py::test_recall_injection
  corpus: evals/corpora/memory_recall_injection/
  minimum_members: 3
- id: gate.memory.scope_isolation
  milestone: 9
  kind: property
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**Scope isolation** — zero cross-tenant and cross-principal results. A hard gate, not a metric to improve."
  check: tests/gates/test_memory_m9.py::test_scope_isolation
- id: gate.memory.trace_faithful
  milestone: 9
  kind: case
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**Trace faithfulness** — for sampled turns, the beliefs listed in the trace must reproduce the rendered block that the recorded hash covers. A hard gate, not a metric to improve."
  check: tests/gates/test_memory_m9.py::test_trace_faithful
- id: gate.memory.view_ceiling
  milestone: 9
  kind: property
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**View ceiling** — no belief above `min(recall ceiling, viewing ceiling)` may ever appear in a view. A hard gate, not a metric to improve."
  check: tests/gates/test_memory_m9.py::test_view_ceiling
- id: gate.memory.retr_correction
  milestone: 9
  kind: case
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**Correction durability** — a rejected belief does not return, including across a consolidation-policy upgrade and a full re-derivation."
  check: tests/gates/test_memory_m9.py::test_retrieval_correction
- id: gate.memory.cache_preserved
  milestone: 9
  kind: case
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**Cache preservation** — measured cached-token ratio must not regress when memory is enabled. This is the invariant's regression test."
  check: tests/gates/test_memory_m9.py::test_cache_preserved
- id: gate.memory.no_triple_regress
  milestone: 9
  kind: case
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**No triple regression** — retrieval improves target eval cases **without** increasing policy failures, without regressing cache utilization, and without raising noise ratio."
  check: tests/gates/test_memory_m9.py::test_no_triple_regress
