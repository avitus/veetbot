# Canonical gate registry entries for the memory area.
- id: gate.memory.contradiction
  milestone: 9
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Contradiction handling** — inject a preference change; verify supersession (not duplication) and that retrieval returns the current belief."
  check: tests/gates/test_memory_m9.py::test_contradiction
- id: gate.memory.no_fabrication
  milestone: 9
  kind: corpus
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**No fabrication** — it must not form beliefs unsupported by episodes."
  check: tests/gates/test_memory_m9.py::test_no_fabrication
  corpus: evals/corpora/memory_no_fabrication/
  minimum_members: 3
- id: gate.memory.form_injection
  milestone: 9
  kind: corpus
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Injection resistance** — an untrusted \"remember X\" must not form a belief."
  check: tests/gates/test_memory_m9.py::test_form_injection
  corpus: evals/corpora/memory_form_injection/
  minimum_members: 3
- id: gate.memory.correction_durable
  milestone: 9
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Correction durability** — a rejected belief must not return, including after a full re-derivation under a newer consolidation policy. A hard gate."
  check: tests/gates/test_memory_m9.py::test_correction_durable
- id: gate.memory.no_policy_regress
  milestone: 9
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**No policy regression** — adapt LOCOMO-style long-horizon scenarios to exercise the write path. Gate: memory improves target eval cases **without** increasing policy failures."
  check: tests/gates/test_harness_m9.py::test_memory_changes_outcome
- id: gate.memory.multi_candidate
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Multiple ordinary memories** — one ordinary user utterance naming two durable entities forms two separate, provenance-linked beliefs, and an independent preference in the same utterance remains a third belief."
  check: tests/gates/test_memory_m10.py::test_ordinary_conversation_forms_one_memory_per_durable_entity
- id: gate.memory.source_integrity
  milestone: 10
  kind: property
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Automatic-source integrity** — automatic candidates name only source events authored by the owning principal; model, tool, and foreign-principal content cannot become a direct source."
  check: tests/gates/test_memory_m10.py::test_automatic_formation_uses_only_the_owning_principal_user_events
- id: gate.memory.idle_lifecycle
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Idle lifecycle** — a terminal run enqueues one idempotent formation flag, returns without extracting, and maintenance consolidates the session only once both the session-idle boundary and the flag's persisted `not_before` have elapsed."
  check: tests/gates/test_memory_m10.py::test_terminal_run_is_flagged_then_consolidated_after_idle
- id: gate.memory.formation_bounded
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Bounded automatic formation** — a pathological utterance cannot commit more than twelve candidates in one consolidation, a secret-shaped candidate is still rejected, and the consolidation audit accounts for extractor overproduction rather than silently truncating it."
  check: tests/gates/test_memory_m10.py::test_automatic_formation_caps_candidates_and_rejects_secrets
- id: gate.memory.correction_isolated
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Ordinary correction isolation** — a natural-language retraction supersedes the matching entity while unrelated entities and preference topics continue to coexist."
  check: tests/gates/test_memory_m10.py::test_ordinary_retraction_supersedes_the_owned_entity_memory
- id: gate.memory.inspection_governed
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Governed inspection and reversibility** — the public memory surface exposes beliefs, formation audits, recall traces, session diagnosis, and provenance-preserving replay through the same principal-scoped service used for edits and deletion; a foreign principal can observe or mutate none of them."
  check: tests/gates/test_memory_m10.py::test_memory_inspection_surface_is_governed_and_traceable
- id: gate.memory.extractor_contract
  milestone: 10
  kind: structural
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Extractor contract coverage** — every shipped MemoryCandidateExtractor implementation is registered against the shared contract for separate, scope-correct, provenance-bound proposals."
  check: tests/contract/test_memory_candidate_extractor_contract.py::test_extractor_returns_separate_provenance_bound_candidate_proposals
- id: gate.memory.provider_activation_bound
  milestone: 10
  kind: property
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Evidence-bound activation** — provider assistance is eligible only on an exact extractor, formation-policy, model-policy, provider, model, policy-profile, and compiled-policy tuple match."
  check: tests/gates/test_memory_m10.py::test_provider_activation_requires_an_exact_evaluation_tuple
- id: gate.memory.provider_boundary
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Provider provenance boundary** — provider proposals remain proposals: invented source ids and secret-shaped source content cannot pass the governed service's provenance and safety checks."
  check: tests/unit/test_memory_provider_extraction.py::test_provider_proposals_still_pass_source_and_secret_gates
- id: gate.memory.provider_audit_fallback
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Audited deterministic fallback** — a failed provider attempt records safe normalized failure fields and returns independently derived deterministic proposals."
  check: tests/unit/test_memory_provider_extraction.py::test_provider_failure_is_audited_and_uses_deterministic_fallback
- id: gate.memory.provider_evidence_publish
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Evidence publication** — the checked-in paired evaluation derives the active provider tuple and corpus hash and atomically publishes activation evidence only after formation lift, at least eighty percent positive-case coverage, zero fabrication in either arm, and no policy regression pass; a failed evaluation leaves no artifact."
  check: tests/unit/test_memory_formation_eval.py::TestProviderEvidencePublicationGate::test_pass_publishes_the_exact_tuple
- id: gate.memory.provider_claim_rendering
  milestone: 10
  kind: structural
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Canonical provider claims** — the provider returns a closed semantic claim with an exact cited evidence substring; deterministic local rendering owns the final belief type, canonical subject, statement, and authorized scope."
  check: tests/unit/test_memory_provider_extraction.py::test_provider_semantic_claims_render_canonical_memories
- id: gate.memory.provider_failure_diagnostics
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Inspectable evaluation failure** — paired evaluation results retain each arm's normalized beliefs, consolidation counts, provider audit outcome and candidate counts, and shared-versus-provider-added attribution; a failed gate returns those diagnostics and the CLI exits non-zero without publishing an activation artifact."
  check: tests/unit/test_memory_formation_eval.py::TestProviderEvidencePublicationGate::test_failure_returns_diagnostics_and_leaves_no_activation_artifact
- id: gate.memory.provider_positive_coverage
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Positive formation coverage** — aggregate lift alone is insufficient: provider assistance must fully support at least seventeen of the twenty-one labeled positive cases before evidence can be published."
  check: tests/unit/test_memory_formation_eval.py::TestProviderEvidencePublicationGate::test_lift_without_minimum_positive_coverage_does_not_publish
- id: gate.memory.provider_source_safety
  milestone: 10
  kind: case
  spec: docs/plan/memory-formation-and-consolidation.md#hard-gates
  statement: "**Authoritative source safety** — secret, injection, or transient markers in authoritative cited source text cannot be erased by provider normalization before the automatic eligibility check."
  check: tests/gates/test_memory_m10.py::test_automatic_formation_rechecks_source_hazards_after_extraction
- id: gate.memory.currency
  milestone: 9
  kind: case
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**Currency** — after a preference change, retrieval must return the new belief and never the superseded one."
  check: tests/gates/test_memory_m9.py::test_currency
- id: gate.memory.historical_correct
  milestone: 9
  kind: case
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**Historical correctness** — an `as_of` query returns what was believed then."
  check: tests/gates/test_memory_m9.py::test_historical_correct
- id: gate.memory.recall_injection
  milestone: 9
  kind: corpus
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**Injection resistance** — a poisoned belief renders `[BLOCKED]` and does not alter behavior."
  check: tests/gates/test_memory_m9.py::test_recall_injection
  corpus: evals/corpora/memory_recall_injection/
  minimum_members: 3
- id: gate.memory.scope_isolation
  milestone: 9
  kind: property
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**Scope isolation** — zero cross-tenant and cross-principal results. A hard gate, not a metric to improve."
  check: tests/gates/test_memory_m9.py::test_scope_isolation
- id: gate.memory.trace_faithful
  milestone: 9
  kind: case
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**Trace faithfulness** — for sampled turns, the beliefs listed in the trace must reproduce the rendered block that the recorded hash covers. A hard gate, not a metric to improve."
  check: tests/gates/test_memory_m9.py::test_trace_faithful
- id: gate.memory.view_ceiling
  milestone: 9
  kind: property
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**View ceiling** — no belief above `min(recall ceiling, viewing ceiling)` may ever appear in a view. A hard gate, not a metric to improve."
  check: tests/gates/test_memory_m9.py::test_view_ceiling
- id: gate.memory.retr_correction
  milestone: 9
  kind: case
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**Correction durability** — a rejected belief does not return, including across a consolidation-policy upgrade and a full re-derivation."
  check: tests/gates/test_memory_m9.py::test_retrieval_correction
- id: gate.memory.cache_preserved
  milestone: 9
  kind: case
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**Cache preservation** — measured cached-token ratio must not regress when memory is enabled. This is the invariant's regression test."
  check: tests/gates/test_memory_m9.py::test_cache_preserved
- id: gate.memory.no_triple_regress
  milestone: 9
  kind: case
  spec: docs/plan/memory-retrieval-and-ranking.md#hard-gates
  statement: "**No triple regression** — retrieval improves target eval cases **without** increasing policy failures, without regressing cache utilization, and without raising noise ratio."
  check: tests/gates/test_memory_m9.py::test_no_triple_regress
- id: gate.memory.bench_corpus_shape
  milestone: 16
  kind: structural
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**The corpus is shaped as declared.** Loading the checked-in corpus yields at least twelve scenarios, every scenario at least two sessions, at least three probes in every category, and at least four protected-abstention scenarios; every category rule, identifier uniqueness rule, and label reference resolves, and a corpus violating any of them is refused."
  check: tests/gates/test_memory_m16.py::test_bench_corpus_shape
- id: gate.memory.bench_reproducible
  milestone: 16
  kind: property
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**The deterministic arm is reproducible.** Two runs of the same commit over the same corpus produce identical aggregate metrics and identical per-probe rows, and no probe records more than one distinct cacheable prefix."
  check: tests/gates/test_memory_m16.py::test_bench_deterministic_arm_is_reproducible
- id: gate.memory.bench_no_regression
  milestone: 16
  kind: case
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**The benchmark does not regress.** Comparing a fresh deterministic run against the checked-in baseline reports no drift and no regression, where regression is any higher-is-better count falling, any lower-is-better count rising, or any probe losing a recalled label."
  check: tests/gates/test_memory_m16.py::test_bench_deterministic_metrics_do_not_regress_baseline
- id: gate.memory.bench_baseline_current
  milestone: 16
  kind: case
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**The baseline is current.** A fresh deterministic run equals the checked-in baseline exactly, so a behavior change cannot land without re-recording it in the same change."
  check: tests/gates/test_memory_m16.py::test_bench_baseline_matches_current_run_exactly
- id: gate.memory.bench_protected_never_rendered
  milestone: 16
  kind: case
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**Protected content never forms and never renders.** Across the corpus, no belief of any status contains a protected fragment, no recall trace renders one, and no abstention probe leaks one."
  check: tests/gates/test_memory_m16.py::test_bench_protected_content_never_forms_or_renders
- id: gate.memory.bench_supersession_current
  milestone: 16
  kind: case
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**A formed update never renders what it superseded.** For every update and correction probe whose superseding belief formed, the superseded statement appears in no trace, and the unformed case is counted separately rather than reported as a currency failure."
  check: tests/gates/test_memory_m16.py::test_bench_formed_updates_never_render_superseded
- id: gate.memory.bench_evidence_publish
  milestone: 16
  kind: case
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**Live evidence exists only when every pass condition held.** A passing live run publishes one artifact carrying the corpus digest, build reference, provider, model, policy profile, compiled policy version, and both memory policy versions, and its validator re-derives every threshold from the counts inside it; a failing run returns diagnostics and writes no artifact, and an existing artifact is never overwritten."
  check: tests/unit/test_memory_benchmark_eval.py::TestBenchmarkEvidencePublicationGate::test_pass_publishes_exact_tuple
- id: gate.memory.bench_cost_ceiling
  milestone: 16
  kind: case
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**The live arm stops before it exceeds its ceiling.** The pre-admission check refuses the run that would cross USD 4.00, records that it stopped for the ceiling, and publishes nothing; a model priced at zero aborts the arm instead of defeating the check."
  check: tests/unit/test_memory_benchmark_eval.py::TestBenchmarkEvidencePublicationGate::test_cost_ceiling_stops_before_exceeding
- id: gate.memory.bench_external_adapters
  milestone: 16
  kind: structural
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**The external adapters map their datasets without vendoring them.** Each of the three loaders round-trips a synthetic fixture shaped like its dataset into scenarios, labeled beliefs, and probes with evidence references, and the repository contains no dataset file."
  check: tests/unit/test_memory_benchmark_external.py::test_adapters_round_trip_synthetic_fixtures
- id: gate.memory.profiles_wired
  milestone: 16
  kind: structural
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**Memory profiles are loaded and mirror the shipped defaults.** The shipped profile document validates to exactly the default models, an operator overlay changes the value the retriever uses, unknown keys are rejected, and the session idle boundary is not in the document."
  check: tests/gates/test_memory_m16.py::test_memory_profiles_are_loaded_and_mirror_shipped_defaults
- id: gate.memory.trace_retention
  milestone: 16
  kind: case
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**Operator trace fields expire on schedule.** A trace past its operator expiry loses its arm latencies, candidate counts, and dropped-for-budget identifiers while its user-safe fields survive intact, an unexpired trace is untouched, and a second sweep changes nothing."
  check: tests/gates/pending.py::pending_gate
- id: gate.memory.decay_lifecycle
  milestone: 16
  kind: case
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**Unused provisional beliefs decay and retire.** Under the sweep an idle provisional belief loses confidence and one below the floor is retired with its validity closed, while an active user-stated belief and a recently reinforced belief are untouched."
  check: tests/gates/pending.py::pending_gate
- id: gate.memory.usage_feedback
  milestone: 16
  kind: case
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**Citing a belief resists decay and never raises confidence.** A belief whose short identifier appears in a completed run's final message is marked cited on its trace, gains utility and a fresh reinforcement instant, and keeps its confidence exactly; a returned-but-uncited belief loses utility; repeating the completion changes nothing."
  check: tests/gates/pending.py::pending_gate
- id: gate.memory.recall_delta
  milestone: 16
  kind: case
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**The recall delta surfaces beliefs formed after the snapshot.** A belief written after a session's snapshot is injected in the next turn through the delta query bounded by the snapshot watermark, without rewriting the cached prefix."
  check: tests/gates/pending.py::pending_gate
- id: gate.memory.correction_lines
  milestone: 16
  kind: case
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**Correction lines are never yielded and never move the prefix.** When a snapshot member is superseded mid-session the next turn carries its correction line, that line survives budget pressure that drops recall blocks, it is never offered for yielding, and the prefix digest is unchanged."
  check: tests/gates/pending.py::pending_gate
- id: gate.memory.established_facts_form
  milestone: 16
  kind: case
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**Established facts enter formation as affirmed candidates.** A fact established in working state from trusted user sources becomes a committed belief at affirmed authority carrying the fact's provenance, while a fact whose sources are untrusted or foreign forms nothing."
  check: tests/gates/pending.py::pending_gate
- id: gate.memory.conflict_surfaced
  milestone: 16
  kind: case
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**A lower-authority contradiction is conflicted, not resolved.** An inference contradicting a user-stated belief commits flagged and linked in both directions, requests confirmation, leaves the original live, and both statements surface together in recall with the link rendered."
  check: tests/gates/pending.py::pending_gate
- id: gate.memory.authority_recency
  milestone: 16
  kind: property
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**The resolver orders authority then recency.** Over generated authority pairs and source orderings, higher authority never loses to lower, equal authority with a later source or instant supersedes, equal authority with no ordering conflicts, and polarity alone never conflicts."
  check: tests/gates/pending.py::pending_gate
- id: gate.memory.rederive_opt_in
  milestone: 16
  kind: case
  spec: docs/plan/memory-evaluation-and-lifecycle.md#hard-gates
  statement: "**Re-derivation is opt-in and replays rejections.** The command refuses without an explicit confirmation, and with it re-consolidates from watermark zero without resurrecting a rejected belief."
  check: tests/gates/pending.py::pending_gate
