# Canonical gate registry entries for Milestone 14 inbound surfaces and pairing.
- id: gate.surface.unpaired_denied
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**An unpaired sender creates nothing content-bearing.** A message from an unknown sender creates no session, run, message, or stored content; its only writes are the content-free receipt and the rejection audit event; it receives one throttled notice."
  check: tests/gates/test_surface_ingress_m14.py::test_unpaired_sender_is_content_free_and_replay_is_a_noop
- id: gate.surface.pairing_ceremony
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**The pairing ceremony is single-use and bound.** A code is hashed, expires, admits a bounded number of attempts, compares in constant time, is returned exactly once, and binds the sender to the minting principal and the granted scopes."
  check: tests/gates/test_surface_api_m14.py::test_pairing_code_is_single_presentation_and_lifecycle_is_scoped
- id: gate.surface.pairing_lockout
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**Failed pairing locks the sender.** Reaching the attempt threshold locks the sender for the configured period; locked attempts are not verified and the lockout is audited."
  check: tests/gates/test_surface_ingress_m14.py::test_failed_pairing_threshold_locks_before_a_correct_code_is_verified
- id: gate.surface.paired_submits_ordinary_run
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**A paired message is an ordinary run.** A paired text yields one session, run, seed event, and checkpoint through the shared submission function, at interactive priority, as a USER message for the paired principal."
  check: tests/gates/test_surface_reply_m14.py::test_terminal_surface_run_enqueues_then_sends_redacted_chunks_once
- id: gate.surface.inbound_idempotent
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**Inbound delivery is idempotent.** A replayed update identifier after a restart or duplicate poll yields one receipt and one run; the poll offset resumes from committed receipts."
  check: tests/gates/test_telegram_m14.py::test_poller_resumes_from_committed_receipt_and_dedupes_through_ingress
- id: gate.surface.ingest_atomic
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**Ingress is atomic across a crash.** No injected pre-commit crash leaves a partial receipt, mapping, session, or run, and the update is re-delivered once."
  check: tests/integration/test_surface_persistence_m14.py::test_postgres_ingress_crash_rolls_back_and_redelivers_once
- id: gate.surface.session_key_stable
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**The session key is stable, rotatable, and never reused.** Messages map to one session; /new, idle time, a closed session, and a stale agent version rotate; a rotated key is never reused; a new session pins the current agent version."
  check: tests/gates/test_surface_domain_m14.py::test_surface_session_rotation_rules_are_closed_and_never_reuse_a_mapping
- id: gate.surface.input_routing
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**Input routing follows the run's state.** A run waiting for user input receives the text as input on the same run; a running run yields a notice and no second run."
  check: tests/gates/test_surface_ingress_m14.py::test_active_run_rejects_while_waiting_run_receives_plain_input
- id: gate.surface.revocation_immediate
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**Revocation takes effect before the next message.** A revoked pairing is denied before any write on the sender's next message and its session keys are rotated."
  check: tests/gates/test_surface_api_m14.py::test_pairing_code_is_single_presentation_and_lifecycle_is_scoped
- id: gate.surface.scope_ceiling
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**Scopes are a ceiling, intersected fresh.** The run stamps the pairing's granted scopes intersected with the principal's current scopes; a lost scope disappears at the next message; the authority version is recorded."
  check: tests/gates/test_surface_ingress_m14.py::test_pairing_then_submission_intersects_fresh_authority_and_dedupes
- id: gate.surface.no_token_leak
  milestone: 14
  kind: corpus
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**The bot token never leaks.** Over a corpus of transport failures, events, logs, spans, receipts, exceptions, and exports the token is absent; the loader rejects unsafe files; the secret-rule family matches it."
  check: tests/gates/test_telegram_m14.py::test_telegram_token_leak_corpus_is_closed_across_transport_and_redaction
  corpus: tests/corpora/surface_token_leak
  minimum_members: 8
- id: gate.surface.reply_chunked_redacted
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**Replies are chunked, ordered, and redacted.** A long reply arrives as ordered chunks within the channel limit; a retry resumes without duplicates; secret-shaped text is redacted; a failure carries a reason code only."
  check: tests/gates/test_surface_reply_m14.py::test_terminal_surface_run_enqueues_then_sends_redacted_chunks_once
- id: gate.surface.approval_roundtrip
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**Approvals and questions round-trip.** An approval notice reaches the chat and /approve resolves it idempotently, first wins; a sender without approval.resolve is refused; a plain reply answers a waiting question."
  check: tests/gates/test_surface_ingress_m14.py::test_approval_command_is_scope_guarded_idempotent_and_first_wins
- id: gate.surface.rate_limited
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**Rate and admission limits hold before any write.** Per-sender rate and per-tenant active-run and cost ceilings are enforced before any content is stored."
  check: tests/integration/test_surface_persistence_m14.py::test_postgres_surface_admission_enforces_active_daily_and_monthly_limits
- id: gate.surface.default_off
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**Surfaces are default-off.** With either flag off the routes are absent and the worker refuses to start; the worker's environment carries no provider, bearer, or browser credential."
  check: tests/unit/test_config.py::test_surface_worker_accepts_telegram_only_and_refuses_default_off
- id: gate.surface.transport_confined
  milestone: 14
  kind: structural
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**The transport is confined.** The adapter reaches only the configured Telegram origin over HTTPS, follows no redirects, bounds response bodies, and maps failures to a closed vocabulary."
  check: tests/gates/test_telegram_m14.py::test_telegram_transport_normalizes_private_updates_and_uses_fixed_origin
- id: gate.surface.persistence_schema
  milestone: 14
  kind: structural
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**The surface schema encodes its trust boundaries.** Metadata inspection proves keys, the partial unique pairing and mapping indexes, cascade and erasure rules, and row-level security."
  check: tests/gates/test_surface_persistence_schema_m14.py::test_surface_schema_encodes_live_uniqueness_and_content_free_receipts
- id: gate.surface.persistence_isolated
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**Surface persistence is principal isolated.** Row-level security and repository predicates prevent cross-tenant and cross-principal reads and mutations."
  check: tests/integration/test_surface_persistence_m14.py::test_postgres_surface_rows_are_tenant_isolated_and_rls_forced
- id: gate.surface.repository_contract
  milestone: 14
  kind: structural
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**Every surface port has executable adapter contracts.** The transport, pairing, session-key, receipt, and admission ports each have a named shared contract exercised by every registered adapter."
  check: tests/integration/test_surface_persistence_m14.py::test_postgres_surface_repositories_satisfy_shared_contract
- id: gate.surface.migration_clean
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**Surfaces migrate cleanly from an empty database.** The migration chain reaches head and exactly matches the declared SQLAlchemy metadata."
  check: tests/integration/test_migrations.py::test_migrations_upgrade_cleanly_and_match_metadata
- id: gate.surface.migration_stepwise
  milestone: 14
  kind: case
  spec: docs/plan/inbound-surfaces.md#hard-gates
  statement: "**The surface migration is reversible at its boundary.** Upgrade, downgrade, and re-upgrade from the immediate predecessor leave a valid schema."
  check: tests/integration/test_migrations.py::test_migrations_round_trip_each_step_from_its_predecessor
