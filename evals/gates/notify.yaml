# Canonical gate registry entries for Milestone 12 notifications.
- id: gate.notify.enqueue_atomic
  milestone: 12
  kind: case
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**Enqueue is atomic with its trigger.** A crash injected after every write in finalize, accounting, and materialization leaves no outbox row without its event or partial row; the only committed event without an outbox row is one whose enqueue failed inside its savepoint, audited in the same transaction, and that failure never changes the run's terminal state."
  check: tests/integration/test_notification_triggers_m12.py::test_postgres_notification_enqueue_is_atomic_for_every_producer
- id: gate.notify.trigger_catalog
  milestone: 12
  kind: case
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**Exactly the five transitions enqueue, and one named producer besides.** Approval requested, waiting for user, run failed, scheduled run accounted, and scheduled occurrence skipped each enqueue one row; interactive completion, cancellation, tool lifecycle events, message deltas, and surface replies enqueue nothing; the Milestone 15 health check is the only non-transition producer and enqueues only the two ops kinds."
  check: tests/unit/test_notification_producer_m12.py::test_exact_transition_catalog_builds_content_free_deduplicated_rows
- id: gate.notify.dedupe
  milestone: 12
  kind: property
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**Repeated triggers deduplicate.** Generated repeats of one transition produce exactly one outbox row per deduplication key."
  check: tests/integration/test_notification_persistence_m12.py::test_postgres_repeated_notification_triggers_create_one_durable_row
- id: gate.notify.content_free
  milestone: 12
  kind: corpus
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**Payloads are content-free.** A corpus of approvals, questions, failures, and schedule instructions carrying secrets, arguments, message text, and reasoning yields payloads with only the closed key set and a templated title."
  check: tests/gates/test_notifications_m12.py::test_notification_payload_is_content_free
  corpus: tests/corpora/notification_content
  minimum_members: 12
- id: gate.notify.dispatch_once
  milestone: 12
  kind: case
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**Concurrent dispatch is safe and replay is bounded.** Two dispatchers racing on one pending row deliver it to each target once under the claim lease and write one delivery row per attempt; a crash between a transport accept and the ledger write re-sends under the same collapse identifier and records a further attempt — at-least-once, never a lost or unrecorded send."
  check: tests/integration/test_notification_dispatcher_postgres_m12.py::test_postgres_concurrent_dispatch_and_accepted_send_replay_are_bounded
- id: gate.notify.retry_bounded
  milestone: 12
  kind: case
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**Retry is bounded and expiry is honoured.** Transient outcomes follow the declared backoff and stop at the ceiling as failed; a row past its expiry is settled expired and never sent."
  check: tests/unit/test_notification_dispatcher_m12.py::test_retry_schedule_is_bounded_and_expired_rows_are_never_sent
- id: gate.notify.stale_suppressed
  milestone: 12
  kind: case
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**Stale notifications are suppressed.** A resolved or expired approval, an answered question, a run no longer waiting, or a deleted session settles superseded with no transport call, and session erasure deletes pending rows in the same transaction."
  check: tests/unit/test_notification_dispatcher_m12.py::test_stale_notification_catalog_is_suppressed_without_transport
- id: gate.notify.token_revoked_on_410
  milestone: 12
  kind: case
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**An unregistered token is invalidated once.** Unregistered and BadDeviceToken invalidate the device's token, append the invalidation event, and remove the device from the next targets; a 5xx or 429 does neither."
  check: tests/unit/test_notification_dispatcher_m12.py::test_unregistered_tokens_invalidate_once_but_transient_failures_do_not
- id: gate.notify.apns_auth
  milestone: 12
  kind: case
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**The APNs adapter authenticates and addresses correctly.** Against a fake server the adapter signs ES256 provider tokens from the configured key file, re-mints inside the window, sends the required headers, selects the host per device environment, and never logs the key or a token."
  check: tests/unit/test_apns_m12.py::test_apns_signs_addresses_and_refreshes_provider_token
- id: gate.notify.port_contracts
  milestone: 12
  kind: structural
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**Every notification port has executable adapter contracts.** The device registry, the outbox, and the push transport each have a named shared contract exercised by every registered adapter."
  check: tests/gates/test_notification_ports_m12.py::test_notification_ports_have_executable_contracts_for_every_adapter
- id: gate.notify.offline_inbox
  milestone: 12
  kind: case
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**A client can read every notification while offline.** With no transport configured, every enqueued kind is later returned by the inbox with its status and delivery outcomes through stable pagination."
  check: tests/gates/test_notification_api_m12.py::test_offline_inbox_paginates_every_kind_with_delivery_outcomes
- id: gate.notify.default_off
  milestone: 12
  kind: case
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**Notifications are default-off and credential-confined.** With both flags off no route mounts, no row is written, and no dispatcher builds; release validation requires the flags to change together; only the notify role loads the push key."
  check: tests/gates/test_notification_api_m12.py::test_notification_http_surface_and_production_are_default_off
- id: gate.notify.migration_clean
  milestone: 12
  kind: case
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**Notifications migrate cleanly from an empty database.** The migration chain reaches head and exactly matches the declared SQLAlchemy metadata."
  check: tests/integration/test_migrations.py::test_migrations_upgrade_cleanly_and_match_metadata
- id: gate.notify.migration_stepwise
  milestone: 12
  kind: case
  spec: docs/plan/notifications-and-devices.md#hard-gates
  statement: "**The notification migration is reversible at its boundary.** Upgrade, downgrade, and re-upgrade from the immediate predecessor leave a valid schema."
  check: tests/integration/test_migrations.py::test_migrations_round_trip_each_step_from_its_predecessor
