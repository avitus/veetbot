# Canonical gate registry entries for the policy area.
- id: gate.policy.totality
  milestone: 4
  kind: property
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**Totality.** Every `SideEffectClass` value has exactly one rule in every loaded profile, and every Section 9.2 row maps to exactly one value. A profile missing a rule fails to load rather than defaulting."
  check: tests/gates/test_policy_m4.py::test_totality
- id: gate.policy.determinism
  milestone: 4
  kind: property
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**Determinism.** The same `(action, principal, run, ruleset)` evaluated one thousand times returns byte-identical output including `reason_code` and `policy_version`. The evaluator's module imports nothing from `infrastructure` and calls no clock."
  check: tests/gates/test_policy_m4.py::test_determinism
- id: gate.policy.single_gate
  milestone: 4
  kind: structural
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**Single gate.** Exactly one function transitions a tool invocation from `PROPOSED` to `AUTHORIZED`, asserted by an import-boundary test, and the sandbox bridge and device channel both reach it."
  check: tests/gates/test_policy_m4.py::test_single_gate
- id: gate.policy.monotonicity
  milestone: 4
  kind: property
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**Monotonicity.** Over the full cross product of deterministic and advisory outputs, the combined rank is never below the deterministic rank."
  check: tests/gates/test_policy_m4.py::test_monotonicity
- id: gate.policy.hardline_immutable
  milestone: 4
  kind: case
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**Hardline immutability and precision.** The loaded set cannot be mutated after import; every rule blocks its target *and* permits its declared `near_miss`."
  check: tests/gates/test_policy_m4.py::test_hardline_immutable
- id: gate.policy.revalidation
  milestone: 4
  kind: case
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**Revalidation.** Each of the four changes in the revalidation table produces its stated consequence, including after a worker restart."
  check: tests/gates/test_policy_m4.py::test_revalidation
- id: gate.policy.cross_tenant
  milestone: 4
  kind: case
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**Cross-tenant.** Get, list, and resolve against another tenant's approval all return not-found."
  check: tests/gates/test_policy_m4.py::test_cross_tenant
- id: gate.policy.no_leakage
  milestone: 4
  kind: case
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**No leakage.** The serialized denial result matches the field allowlist exactly, for every `reason_code`."
  check: tests/gates/test_policy_m4.py::test_no_leakage
- id: gate.policy.idempotent_resolve
  milestone: 4
  kind: case
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**Idempotent resolution.** Two concurrent identical resolutions produce one state change and two successes; two concurrent differing resolutions produce one state change and one conflict."
  check: tests/gates/test_policy_m4.py::test_idempotent_resolve
- id: gate.policy.prompt_not_authz
  milestone: 4
  kind: corpus
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**Prompt is not authorization.** Across the injection corpus Section 22 requires, untrusted content instructing a `REQUIRE_APPROVAL` action produces an approval request in every case and an execution in none."
  check: tests/gates/test_policy_m4.py::test_prompt_not_authz
  corpus: evals/corpora/injection/
  minimum_members: 40
- id: gate.policy.scope_grammar
  milestone: 4
  kind: structural
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**Scope grammar.** Every entry in the fifteen-string vocabulary and every `required_scopes` entry on a registered `ToolSpec` matches the grammar, and registration rejects an MCP tool declaring a scope that is neither in the vocabulary nor prefixed `mcp.{server_id}.`."
  check: tests/gates/test_policy_m4.py::test_scope_grammar
- id: gate.policy.scope_match
  milestone: 4
  kind: case
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**Scope matching is a subset test over exact strings.** A principal holding one of a tool's two required scopes is denied with `policy.scope.missing`, the denial names the missing scope and not the held one, holding both succeeds, and holding `run.write` does not satisfy a requirement for `run.read`."
  check: tests/gates/test_policy_m4.py::test_scope_match
- id: gate.policy.scope_stamped
  milestone: 4
  kind: case
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**The scope set is the run's.** Narrowing a principal's scopes after submission changes no decision in the run already submitted, and the next run that principal submits is denied."
  check: tests/gates/test_policy_m4.py::test_scope_stamped
- id: gate.policy.advisory_monotonic
  milestone: 30
  kind: property
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**The composite cannot lower a rank.** Over the full cross product of deterministic decisions and advisor verdicts, evaluated through `AdvisedPolicyEngine` rather than the combination function alone, the result's rank is never below the deterministic rank, it never carries modifications the deterministic layer did not produce, and its `policy_version` is the deterministic one."
  check: tests/gates/pending.py::pending_gate
- id: gate.policy.advisory_allow_path_once
  milestone: 30
  kind: case
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**The advisor runs on allow paths only, and once.** It is never called after a hardline block, a `DENY`, a `REQUIRE_APPROVAL`, or an `ALLOW_WITH_MODIFICATIONS`, never for an action outside the consulted class, never at revalidation, and never for an invocation that already has a row; a persisted escalation survives a restart."
  check: tests/gates/pending.py::pending_gate
- id: gate.policy.advisory_abstains
  milestone: 30
  kind: case
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**An unavailable advisor abstains.** A timeout, a provider error, a missing credential, and an invalid response each return the deterministic decision byte-identical and fail no run; with the layer enabled and no provider composed, composition uses the deterministic engine."
  check: tests/gates/pending.py::pending_gate
- id: gate.policy.advisory_blind_redacted
  milestone: 30
  kind: structural
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**The advisor is blind to the rules, and what it sees is redacted.** No advisor request contains a hardline pattern, path, range, or identifier, the profile's name or contents, a `policy_version`, or a deterministic decision; sensitive keys and credential-shaped values are masked, every untrusted string is escaped and delimited, and the advisor module imports neither the loader nor the hardline module."
  check: tests/gates/pending.py::pending_gate
- id: gate.policy.advisory_default_off
  milestone: 30
  kind: case
  spec: docs/plan/policy-and-approvals.md#hard-gates
  statement: "**Off and observing change nothing.** With `advisory.enabled` false no advisor is constructed and no judgment request is made; in `observe` mode every decision is byte-identical to the deterministic decision while the verdict is recorded; and no shipped advisor returns `deny`."
  check: tests/gates/pending.py::pending_gate
